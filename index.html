e casket's contents.","EFFECT":"Instead of rolling to determine the Loot casket's contents, add D3x10 credits to your gang's Stash and then remove the Loot casket from the battlefield.","SOURCE":"Ironhead Squat Prospectors Pack"},{"NAME":"Thermal Visor","RESTRICTION":"Ironhead Squat Prospectors","CONDITIONS":"Play this gang tactic when activating a friendly model.","EFFECT":"For the duration of this activation, increase the value of the Visibility (X\") rule by 6\". If this Visibility (X\") rule is not in effect for this battle you may discard this gang tactic and select another.","SOURCE":"Ironhead Squat Prospectors Pack"},{"NAME":"Too Stubborn to Die","RESTRICTION":"Ironhead Squat Prospectors","CONDITIONS":"Play this gang tactic when damage is inflicted upon a friendly fighter, after Injury dice are rolled.","EFFECT":"Discard one Injury dice of your choice before applying the effects.","SOURCE":"Ironhead Squat Prospectors Pack"},{"NAME":"Vengeance of the Ironhead!","RESTRICTION":"Ironhead Squat Prospectors","CONDITIONS":"Play this gang tactic after a friendly fighter has been taken Out of Action by an enemy model.","EFFECT":"A friendly fighter with line of sight to the enemy fighter may immediately make a Shoot (Basic) action targeting the enemy fighter.","SOURCE":"Ironhead Squat Prospectors Pack"},{"NAME":"Veteran of the Wastes","RESTRICTION":"Ironhead Squat Prospectors","CONDITIONS":"Play this gang tactic at the start of the battle, after both sides have deployed, but before the first round.","EFFECT":"Until the end of the battle, a friendly model of your choice gains a random skill from one of their Primary skill sets.","SOURCE":"Ironhead Squat Prospectors Pack"},{"NAME":"Combat Power Distribution","RESTRICTION":"Ironhead Squat Prospectors","CONDITIONS":"Play this gang tactic after both crews have been deployed, before the first roll for Priority.","EFFECT":"Select a friendly fighter equipped with an exo-suit. Increase the Strength and AP characteristics of one of their close combat weapons by 1 for the duration of the battle. Additionally, all of their weapons gain the Reckless trait.","SOURCE":"Halls of the Ancients"},{"NAME":"Eager to Impress","RESTRICTION":"Ironhead Squat Prospectors","CONDITIONS":"Play this gang tactic after both crews have been deployed, before the first roll for Priority.","EFFECT":"Select a friendly Exo-kyn fighter. If during the battle the take an enemy Leader or Champion Out of Action, they earn an additional D3 XP.","SOURCE":"Halls of the Ancients"},{"NAME":"Our Clan Heritage","RESTRICTION":"Ironhead Squat Prospectors","CONDITIONS":"Play this gang tactic after both crews have been deployed, before the first roll for Priority.","EFFECT":"Select a friendly Champion. During this battle's post-battle sequence this fighter may select any Ancestry post-battle action and perform it even if in Recovery or Convalescence.","SOURCE":"Halls of the Ancients"},{"NAME":"Control Node Extender","RESTRICTION":"Ironhead Squat Prospectors","CONDITIONS":"Play this gang tactic after both crews have been deployed, before the first roll for Priority.","EFFECT":"Select a friendly fighter. Any Exotic Beasts they are equipped with must remain within 9\" rather than the usual 3\".","SOURCE":"Halls of the Ancients"},{"NAME":"Gravel to the End","RESTRICTION":"Ironhead Squat Prospectors","CONDITIONS":"Play this gang tactic during the End phase of any round after making Bottle checks.","EFFECT":"For the during of this End phase, when rolling to see if friendly Prone and Seriously Injured fighters recover, they are all considered to have rolled a Flesh Wound, there is no need to roll the dice.","SOURCE":"Halls of the Ancients"},{"NAME":"Making a Stand","RESTRICTION":"Ironhead Squat Prospectors","CONDITIONS":"Play this gang tactic at the start of any round, before rolling for Priority.","EFFECT":"Select a friendly fighter. For the duration of this round, they cannot be placed Prone and Pinned. At the start of the End phase, change the fighter's Status to Prone and Seriously Injured.","SOURCE":"Halls of the Ancients"},{"NAME":"Mining Tunnels","RESTRICTION":"Ironhead Squat Prospectors","CONDITIONS":"Play this gang tactics at the start of a battle, before deploying starting crews.","EFFECT":"Select a friendly fighter equipped with an exo-suit. For the duration of the battle, they gain the Infiltrate skill.","SOURCE":"Halls of the Ancients"},{"NAME":"Low Blow","RESTRICTION":"Ironhead Squat Prospectors","CONDITIONS":"Play this gang tactics when activating a friendly fighter, before performing any actions.","EFFECT":"For the duration of this activation, whenever this fighter performs a shooting attack against an enemy on a higher elevation, they apply a +1 modifier to any Wound rolls.","SOURCE":"Halls of the Ancients"},{"NAME":"Automatic Rain","RESTRICTION":"Ironhead Squat Prospectors","CONDITIONS":"Play this gang tactics when activating a friendly fighter, before performing any actions.","EFFECT":"For the duration of this activation, increase the Rapid Fire (X) trait on all of this fighter's weapons to Rapid Fire (X+1). Any weapon fired during this activation automatically runs Out of Ammo.","SOURCE":"Halls of the Ancients"},{"NAME":"Heads of Iron","RESTRICTION":"Ironhead Squat Prospectors","CONDITIONS":"Play this gang tactic during the End phase of any round after making Bottle checks.","EFFECT":"The Bottle check is automatically passed, there is no need to roll the dice.","SOURCE":"Halls of the Ancients"},{"NAME":"Overclocked Reactor","RESTRICTION":"Ironhead Squat Prospectors","CONDITIONS":"Play this gang tactics when activating a friendly vehicle, before performing any actions.","EFFECT":"For the duration of this activation, the vehicle's Movement characteristic is increased by 2\" and their Handling characteristic reduced by 2.","SOURCE":"Halls of the Ancients"},{"NAME":"Ramming Breach","RESTRICTION":"Ironhead Squat Prospectors","CONDITIONS":"Play this gang tactics when activating a friendly vehicle, before performing any actions.","EFFECT":"For the duration of this activation, the vehicle takes no damage from head-on collisions.","SOURCE":"Halls of the Ancients"},{"NAME":"Respirator Pipes","RESTRICTION":"Ironhead Squat Prospectors","CONDITIONS":"Play this gang tactic after both crews have been deployed, before the first roll for Priority.","EFFECT":"Select D3 friendly fighters. For the duration of the battle, the selected fighters are equipped with respirators.","SOURCE":"Halls of the Ancients"},{"NAME":"Burst of Speed","RESTRICTION":"Ironhead Squat Prospectors","CONDITIONS":"Play this gang tactics when activating a friendly fighter, before performing any actions.","EFFECT":"For the duration of this activation, this fighter may perform a single Move (Free) action.","SOURCE":"Halls of the Ancients"},{"NAME":"Inferno Rounds","RESTRICTION":"Ironhead Squat Prospectors","CONDITIONS":"Play this gang tactics when activating a friendly fighter, before performing any actions.","EFFECT":"For the duration of this activation, any Ironhead autoguns or Ironhead boltguns this fighter is equipped with gain the Blaze trait.","SOURCE":"Halls of the Ancients"},{"NAME":"Iron Swing","RESTRICTION":"Ironhead Squat Prospectors","CONDITIONS":"Play this gang tactic after both crews have been deployed, before the first roll for Priority.","EFFECT":"Select a friendly fighter. For the duration of the battle, one of their weapons with the Melee trait gains the Knockback trait.","SOURCE":"Halls of the Ancients"},{"NAME":"That All You've Got?","RESTRICTION":"Ironhead Squat Prospectors","CONDITIONS":"Play this gang tactic when activating a friendly fighter with at least three Flesh Wounds, before performing any actions.","EFFECT":"For the duration of this activation, each time the selected fighter takes an enemy fighter Out of Action they earn an additional D3 XP.","SOURCE":"Halls of the Ancients"},{"NAME":"The Iron Ride","RESTRICTION":"Ironhead Squat Prospectors","CONDITIONS":"Play this gang tactic when activating a friendly fighter subject to the Mounted condition, before performing any actions.","EFFECT":"Until the start of this fighter's next activation, their Toughness characteristic is considered to be one higher for the purpose of Wound rolls.","SOURCE":"Halls of the Ancients"}];

cards = CARDS_DATA.map((c, i) => ({
  id: i,
  name: c.NAME,
  restriction: c.RESTRICTION,
  conditions: c.CONDITIONS,
  effect: c.EFFECT,
  source: c.SOURCE
}));
const LS_AUTO = 'nm_autosave';
const LS_DECKS = 'nm_decks';
const LS_DECK_NAME = 'nm_deckname';
init();

function init() {
  const restrictions = [...new Set(cards.map(c => c.restriction))].sort((a, b) => {
    if (a === 'Anyone') return -1;
    if (b === 'Anyone') return 1;
    return a.localeCompare(b);
  });
  activeFilters = new Set(restrictions.filter(r => r === 'Anyone'));

  const grid = document.getElementById('filters-grid');
  restrictions.forEach(r => {
    const label = document.createElement('label');
    label.className = 'filter-item';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = r === 'Anyone';
    cb.dataset.restriction = r;
    cb.addEventListener('change', () => {
      if (cb.checked) activeFilters.add(r); else activeFilters.delete(r);
      buildAll();
    });
    label.appendChild(cb);
    label.appendChild(document.createTextNode(r));
    grid.appendChild(label);
  });

  autoRestore();
  buildAll();
  buildSelected();
  renderDecks();
}

function setAllFilters(on) {
  document.querySelectorAll('#filters-grid input').forEach(cb => {
    cb.checked = on;
    if (on) activeFilters.add(cb.dataset.restriction);
    else activeFilters.delete(cb.dataset.restriction);
  });
  buildAll();
}

function mkRow(c) {
  return `<tr id="row-${c.id}" class="${selected.has(c.id) ? 'selected-row' : ''}">
    <td><input type="checkbox" id="cb-${c.id}" ${selected.has(c.id) ? 'checked' : ''} onchange="toggle(${c.id})"></td>
    <td><strong>${c.name}</strong></td>
    <td><span class="restrict">${c.restriction}</span></td>
    <td>${c.conditions}</td>
    <td>${c.effect}</td>
    <td><span class="src">${c.source}</span></td>
  </tr>`;
}

function buildAll() {
  const visible = cards.filter(c => activeFilters.has(c.restriction));
  const body = document.getElementById('all-body');
  const empty = document.getElementById('all-empty');
  if (visible.length === 0) {
    body.innerHTML = '';
    empty.style.display = 'block';
  } else {
    body.innerHTML = visible.map(mkRow).join('');
    empty.style.display = 'none';
  }
  applySearch();
}


function buildSelected() {
  const body = document.getElementById('selected-body');
  const empty = document.getElementById('selected-empty');
  const table = document.getElementById('selected-table');
  if (selected.size === 0) {
    empty.style.display = 'block';
    table.style.display = 'none';
    updateUI();
    return;
  }
  empty.style.display = 'none';
  table.style.display = 'table';
  body.innerHTML = [...selected].map(id => mkRow(cards[id])).join('');
  updateUI();
}

function toggle(id) {
  selected.has(id) ? selected.delete(id) : selected.add(id);
  const row = document.getElementById(`row-${id}`);
  if (row) row.className = selected.has(id) ? 'selected-row' : '';
  const cb = document.getElementById(`cb-${id}`);
  if (cb) cb.checked = selected.has(id);
  autoSave();
  buildSelected();
}

function updateUI() {
  const n = selected.size;
  document.getElementById('selected-tab').textContent = `Selected (${n})`;
  document.getElementById('count-badge').textContent = `${n} card${n !== 1 ? 's' : ''} selected`;
  document.getElementById('pdf-btn').disabled = n === 0;
}

function showTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}


// ── LOCAL STORAGE / DECKS ──────────────────────────────────────────────────
function autoSave() {
  localStorage.setItem(LS_AUTO, JSON.stringify([...selected]));
}

function autoRestore() {
  try {
    const saved = JSON.parse(localStorage.getItem(LS_AUTO) || '[]');
    saved.forEach(id => { if (cards[id]) selected.add(id); });
  } catch(e) {}
  try {
    const name = localStorage.getItem(LS_DECK_NAME) || '';
    const input = document.getElementById('deck-name-input');
    if (input && name) input.value = name;
  } catch(e) {}
}

function loadDecks() {
  try { return JSON.parse(localStorage.getItem(LS_DECKS) || '{}'); }
  catch(e) { return {}; }
}

function saveDecks(decks) {
  localStorage.setItem(LS_DECKS, JSON.stringify(decks));
}

function saveDeck() {
  const input = document.getElementById('deck-name-input');
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  if (selected.size === 0) { alert('No cards selected.'); return; }
  const decks = loadDecks();
  decks[name] = [...selected];
  saveDecks(decks);
  renderDecks();
}

function loadDeck(name) {
  const decks = loadDecks();
  if (!decks[name]) return;
  selected.clear();
  decks[name].forEach(id => { if (cards[id]) selected.add(id); });
  autoSave();
  buildAll();
  buildSelected();
  const input = document.getElementById('deck-name-input');
  if (input) input.value = name;
}

function deleteDeck(name) {
  const decks = loadDecks();
  delete decks[name];
  saveDecks(decks);
  renderDecks();
}

function renderDecks() {
  const decks = loadDecks();
  const list = document.getElementById('deck-list');
  if (!list) return;
  const names = Object.keys(decks);
  list.innerHTML = '';
  if (names.length === 0) {
    list.innerHTML = '<span class="deck-empty">No saved decks yet.</span>';
    return;
  }
  names.forEach(function(name) {
    const n = decks[name].length;
    const div = document.createElement('div');
    div.className = 'deck-item';
    const nameSpan = document.createElement('span');
    nameSpan.className = 'deck-item-name';
    nameSpan.textContent = name;
    const countSpan = document.createElement('span');
    countSpan.className = 'deck-item-count';
    countSpan.textContent = n + ' card' + (n !== 1 ? 's' : '');
    const loadBtn = document.createElement('button');
    loadBtn.className = 'btn-sm';
    loadBtn.textContent = 'Load';
    loadBtn.addEventListener('click', function() { loadDeck(name); });
    const delBtn = document.createElement('button');
    delBtn.className = 'btn-sm';
    delBtn.textContent = 'Delete';
    delBtn.addEventListener('click', function() { deleteDeck(name); });
    div.appendChild(nameSpan);
    div.appendChild(countSpan);
    div.appendChild(loadBtn);
    div.appendChild(delBtn);
    list.appendChild(div);
  });
}


// ── SEARCH ────────────────────────────────────────────────────────────────
function highlightText(text, q) {
  const lower = text.toLowerCase();
  const ql = q.toLowerCase();
  let out = '';
  let i = 0;
  while (i < text.length) {
    const idx = lower.indexOf(ql, i);
    if (idx === -1) { out += text.slice(i); break; }
    out += text.slice(i, idx) + '<mark>' + text.slice(idx, idx + ql.length) + '</mark>';
    i = idx + ql.length;
  }
  return out;
}

function highlightHtml(source, q) {
  // Plain text cell (no tags) – highlight directly
  if (!source.includes('<')) return highlightText(source, q);
  // Cell with inner HTML – highlight text segments around/between tags
  return source
    .replace(/^([^<]*)/, function(_, t) { return highlightText(t, q); })
    .replace(/>([^<]*)</g, function(_, t) { return '>' + highlightText(t, q) + '<'; })
    .replace(/([^>]*)$/, function(_, t) { return highlightText(t, q); });
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  applySearch();
}

function applySearch() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  const clearBtn = document.getElementById('search-clear');
  if (clearBtn) clearBtn.style.display = q ? 'block' : 'none';
  document.querySelectorAll('#all-body tr').forEach(function(row) {
    const cells = row.querySelectorAll('td');
    // Restore any previously highlighted cells
    cells.forEach(function(td) {
      if (td.dataset.orig !== undefined) td.innerHTML = td.dataset.orig;
    });
    if (!q) { row.style.display = ''; return; }
    // Search only in: name (1), conditions (3), effect (4)
    const searchIdx = [1, 3, 4];
    const searchText = searchIdx.map(function(i) {
      return cells[i] ? cells[i].textContent : '';
    }).join(' ').toLowerCase();
    if (!searchText.includes(q)) { row.style.display = 'none'; return; }
    row.style.display = '';
    // Highlight only in searched columns
    searchIdx.forEach(function(i) {
      const td = cells[i];
      if (!td) return;
      if (td.dataset.orig === undefined) td.dataset.orig = td.innerHTML;
      td.innerHTML = highlightHtml(td.dataset.orig, q);
    });
  });
}

// ── PDF EXPORT ─────────────────────────────────────────────────────────────
function exportPDF() {
  const sel = [...selected].map(id => cards[id]);
  if (!sel.length) return;
  // Use an absolute file URL so the popup window can resolve the image
  const bgUrl = new URL('images/CardBack.png', document.baseURI).href;
  openPDF(sel, bgUrl);
}
