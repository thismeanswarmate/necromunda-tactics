STRICTION":"Anyone","CONDITIONS":"After activation, before performing actions.","EFFECT":"Every wall has a ductway through it.","SOURCE":"Hive Secundus Pack"},{"NAME":"Corrupted Ammunition","RESTRICTION":"Anyone","CONDITIONS":"Play after a friendly fighter is targeted by a ranged attack.","EFFECT":"The model currently activated has the Damage characteristic of each ranged weapon reduced by 1, to a minimum of 1.","SOURCE":"Hive Secundus Pack"},{"NAME":"Lumen Flare","RESTRICTION":"Anyone","CONDITIONS":"Play at the start of any round before rolling for Priority.","EFFECT":"The Visibility (X”) rule is increased by 6”.","SOURCE":"Hive Secundus Pack"},{"NAME":"Blood Brothers","RESTRICTION":"Orlock","CONDITIONS":"Play this gang tactic at the start of the Deployment step of the pre-battle sequence, before any fighters have been deployed.","EFFECT":"The gang may recruit two Hive Scum for this battle without needing to pay a hiring fee or the cost of their weapons and Wargear. If they do so, during the post-battle sequence the gang gains only half the amount of credits from scenario rewards. If you do not ahve the models available to represent these Hive Scum, you may discard this gang tactic and select another.","SOURCE":"Orlock (HoI) Pack"},{"NAME":"Down But Not Out","RESTRICTION":"Orlock","CONDITIONS":"Play this gang tactic when activating a Seriously Injured friendly fighter that is within 3\" of a friendly Standing and Active Orlock fighter.","EFFECT":"The activated fighter suffers a Flesh wound and then becomes Standing and Active. The fighter may then make a single Basic or Simple Action, after which the fighter's activation ends.","SOURCE":"Orlock (HoI) Pack"},{"NAME":"Grandstanding","RESTRICTION":"Orlock","CONDITIONS":"Play this gang tactic at the start of the Deployment step of the pre-battle sequence, before any fighters have been deployed.","EFFECT":"If your (Leader) is not part of your crew, one (Champion) of your choice within your crew may be replaced by your (Leader). If no (Champions) are part of your crew, a (Ganger) may be replaced instead. If your (Leader) is aprt of your crew already, you may discard this gang tactic and select another.","SOURCE":"Orlock (HoI) Pack"},{"NAME":"Initiation","RESTRICTION":"Orlock","CONDITIONS":"Play this gang tactic at the start of the Deployment step of the pre-battle sequence, before any fighters have been deployed.","EFFECT":"Your gang may immediately recruit up to three Greenhorns. These fighters are recruited for free, but each will leave the gang at the end of this battle. Each Greenhorn is armed with a sawn-off shotgun and flak armor. These fighters are not counted towards your maximum crew size - they are taken in addition to your starting crew. If you do not have models available to represent these fighters, you may discard this gang tactic and select another.","SOURCE":"Orlock (HoI) Pack"},{"NAME":"Showboating","RESTRICTION":"Orlock","CONDITIONS":"Play this gang tactic when a friendly Orlock fighter takes an enemy fighter Out of Action with an attack as part of a Charge (Double) action.","EFFECT":"If the fighter is no longer Engaged, they may immediately make a second, free Charge (Double) action. If the fighter is Engaged, they may immediately make a free Fight (Basic) action instead.","SOURCE":"Orlock (HoI) Pack"},{"NAME":"Tough As Nails","RESTRICTION":"Orlock","CONDITIONS":"Play this gang tactic during the Priority phase of any round, after Roll for Priority, but before Ready Fighters.","EFFECT":"Choose a friendly Orlock fighter with the Gang Hierarchy (x) special rule. For the remainder of this battle, roll a d6 each time the chosen fighter suffers a wound (roll seperately for each wound caused by a single attack). On a 2+, that wound is ignored. On a 1, the fighter suffers the wound as normal and this gang tactic is immediately discarded. Should the fighter suffer an injury without suffering a wound (e.g., due to a weapon with the Gas trait), this gang tacic is immediately discarded.","SOURCE":"Orlock (HoI) Pack"},{"NAME":"Bond of Iron","RESTRICTION":"Orlock","CONDITIONS":"Play this gang tactic during the Priority phase of any round, after Roll for Priority, but before Ready Fighters.","EFFECT":"Until the End phase of this round, all friendly Orlock fighters with the Group Activation (X) special rule can activate one additional fighter as part of any Group Activation they make, e.g., a fighterwith Group Activation (2) can activate three fighters instead.","SOURCE":"Orlock (HoI) Pack"},{"NAME":"Boom Boom Surprise","RESTRICTION":"Orlock","CONDITIONS":"Play this gang tactic instead of activating a fighter.","EFFECT":"Choose a Promethium Barrel Gang Terrain feature that is within 8\" of a friendly fighter that can see the chosen Promethium Barrel. The barrel explodes; resolve the effects of an attack with an incendiary charge centered on the Promethium Barrel. After this gang tactic is resolved, remove the Promethium Barrel from the battlefield.","SOURCE":"Orlock (HoI) Pack"},{"NAME":"Protection Duty","RESTRICTION":"Orlock","CONDITIONS":"Play this gang tactic at the start of the Deployment step of the pre-battle sequence, before any fighters have been deployed.","EFFECT":"Your gang may be joined by a Rebel Lord. This fighter will leave the gang at the end of this battle. This fighter is not counted towards your maximum crew size - they are taken in addition to your starting crew. If you do not have a model available to represent this fighter, then you may discard this gang tactic and select another. If this Rebel Lord is taken Out of Action, every friendly fighter suffers a -2 modifier to their Cool for the remainder of this battle. Additionally, if this battle is part of a campaign, your gang loses 5 Reutation (to a minimum of 0), and the gang that takes the Rebel lord Out of Action gains 3 Reputation, at the end of the battle.","SOURCE":"Orlock (HoI) Pack"},{"NAME":"Quick Trick","RESTRICTION":"Orlock","CONDITIONS":"Play this gang tactic when an enemy fighter declares a Charge (Double) action and moves within 1\" of a friendly Orlock fighter.","EFFECT":"The fighter can immediately make an attack with a sawn-off shotgun against the charging fighter even if they are not equipped with one. The enemy fighter cannot be Pinned by this attack but, if they are Seriously Injured, their activation ends.","SOURCE":"Orlock (HoI) Pack"},{"NAME":"Strength of Arms","RESTRICTION":"Orlock","CONDITIONS":"Play this gang tactic during the Priority phase of any round, after Roll for Priority, but before Ready Fighters.","EFFECT":"Until the End phase of this round, attacks made by friendly Orlock fighters made with a weapon that has the Melee trait gain +1S for each additionaly fighter that is also Engaged with the target, to a maximum of +3.","SOURCE":"Orlock (HoI) Pack"},{"NAME":"Wall of Iron","RESTRICTION":"Orlock","CONDITIONS":"Play this gang tactic during the Priority phase of any round, after Roll for Priority, but before Ready Fighters.","EFFECT":"Until the End phase of this round, any friendly fighter that is in base contact with one or more Standing and Active friendly Orlock fighters cannot be involuntarily placed Prone and Pinned (they may, however, voluntarily go Prone should you wish).","SOURCE":"Orlock (HoI) Pack"},{"NAME":"What's in a Name?","RESTRICTION":"Orlock","CONDITIONS":"Play this gang tactic at the start of the battle, after both sides have deployed but before the first round.","EFFECT":"Choose a friendly Orlock fighter in your starting crew. Until the end of this battle, that fighter gains one additional Orlock Legendary name of your choice. This does not affect their Credit Cost.","SOURCE":"Orlock (HoI) Pack"},{"NAME":"Ammo Pack","RESTRICTION":"Orlock","CONDITIONS":"Play this gang tactic instead of activating a fighter.","EFFECT":"Choose a friendly Orlock fighter with the Munitioneer Skill. All friendly fighters within 6\" and line of sight of that fighter that have the Out of Ammo condition may immediately perform a free Reload (simple) action. A fighter can perform this action even if they would normally be unable to do so (if, for example, if their weapon has the Scarce trait). Seriously Injured fighters, however, are not affected by this gang tactic.","SOURCE":"Orlock (HoI) Pack"},{"NAME":"Seismic Surprise","RESTRICTION":"Orlock","CONDITIONS":"Play this gang tactic when a friendly Orlock fighter performs a Shoot (Basic) action with a frag grenade.","EFFECT":"Until the end of their activation, this fighter's frag grenades gain the Seismic trait.","SOURCE":"Orlock (HoI) Pack"},{"NAME":"Stepping Up","RESTRICTION":"Orlock","CONDITIONS":"Play this gang tactic when a friendly Orlock fighter with the Gang Hierarchy (Leader) trait is taken Out of Action","EFFECT":"Choose a friendly Orlock fighter that is on the battlefield and has the Gang Hierarchy (Champion) skill. Until the end of this battle, or until the chosen fighter is taken Out of Action, the chosen fighter replaces their Gang Hierarchy (Champion) and Group Activation (1) special rules with the Gang Hierarchy (Leader) and Group Activation (2) special rules.","SOURCE":"Orlock (HoI) Pack"},{"NAME":"Trigger Discipline","RESTRICTION":"Orlock","CONDITIONS":"Play this gang tactic during the Priority phase of any round, after Roll for Priority, but before Ready Fighters.","EFFECT":"Until the End phase of this round, all friendly Orlock fighters that start their activation within 6\" of a friendly fighter with the Gang Hierarchy (X) rule count as having the Steady Hands skill.","SOURCE":"Orlock (HoI) Pack"},{"NAME":"Up Close and Personal","RESTRICTION":"Orlock","CONDITIONS":"Play this gang tactic during the Priority phase of any round, after Roll for Priority, but before Ready Fighters.","EFFECT":"Choose up to three friendly Orlock fighters. Untilk the end of the abttle, any sawn-off shotguns carried by those fighters gain the Sidearm trait.","SOURCE":"Orlock (HoI) Pack"},{"NAME":"Bond of Brotherhood","RESTRICTION":"Orlock","CONDITIONS":"Play this card at the end of a friendly fighter’s turn, when they are within 3’’ of a friendly fighter who is Seriously Injured.","EFFECT":"The fighter can immediately make a Fight (basic) or Shoot (basic) action. This is in addition to the two other actions they can make during their turn.","SOURCE":"Orlock Pack"},{"NAME":"Violent-Minded","RESTRICTION":"Anyone","CONDITIONS":"Play this card when activating a fighter.","EFFECT":"This turn, the fighter can make an additional action (usually three rather than two), as long as at least one of their actions is Shoot or Fight.","SOURCE":"Orlock Pack"},{"NAME":"Ambition","RESTRICTION":"Orlock","CONDITIONS":"Play this card when it is your turn to activate a fighter.","EFFECT":"Pick a Juve or a Ganger with a Ready marker. For this turn only that fighter is treated as a Leader for the purposes of activating groups – in other words, if they are activated, you can activate up to two other fighters within 4’’ of them.","SOURCE":"Orlock Pack"},{"NAME":"Double Fisted","RESTRICTION":"Anyone","CONDITIONS":"Play when a fighter makes a ranged attack.","EFFECT":"For the duration of the ranged attack, the fighter can attack with two ranged weapons, resolving a full attack with each, one after the other. Both must be made against the same target.","SOURCE":"Orlock Pack"},{"NAME":"Secret Cache","RESTRICTION":"Anyone","CONDITIONS":"Play this card instead of activating a fighter.","EFFECT":"Set up an ammo cache anywhere on the battlefield.","SOURCE":"Orlock Pack"},{"NAME":"Solidarity","RESTRICTION":"Orlock","CONDITIONS":"Play at the start of any round.","EFFECT":"For the duration of the round, fighters from your gang automatically pass any Cool checks they make as long as they are within 6’’ of another fighter from your gang.","SOURCE":"Orlock Pack"},{"NAME":"Steel Fury","RESTRICTION":"Anyone","CONDITIONS":"Play this card at the start of any round.","EFFECT":"For the duration of this round, fighters from this gang count the Fight (Basic) action as a Fight (Simple) action.","SOURCE":"Orlock Pack"},{"NAME":"What's a few Teeth?","RESTRICTION":"Anyone","CONDITIONS":"Play this when a friendly fighter suffers a Flesh Wound.","EFFECT":"The Flesh Wound is ignored. Any other effects of the injury still apply.","SOURCE":"Orlock Pack"},{"NAME":"Beat Down","RESTRICTION":"Orlock","CONDITIONS":"Play at the start of any round.","EFFECT":"For the duration of the round, all unarmed close combat attacks made by your fighters that hit, automatically inflict a Flesh Wounds unless a save roll is made. No wound roll or injury roll is made.","SOURCE":"Orlock Pack"},{"NAME":"Die Trying","RESTRICTION":"Orlock","CONDITIONS":"Play at the start of any round.","EFFECT":"For the duration of the turn, Seriously Injured fighters in your gang can provide assists and interference as if they were standing.","SOURCE":"Orlock Pack"},{"NAME":"Fire Discipline","RESTRICTION":"Anyone","CONDITIONS":"Play this card at the start of the battle, after setting up your gang.","EFFECT":"For the duration of the battle, ranged attacks made by your fighters only trigger an Ammo check if the Firepower dice rolls an Ammo symbol and the hit roll is a success.","SOURCE":"Orlock Pack"},{"NAME":"For Close Encounters","RESTRICTION":"Orlock","CONDITIONS":"Play this card when activating a fighter.","EFFECT":"Put this card under the active fighter’s Fighter card. Until the end of a the battle, this fighter has a sawn-off shotgun in addition to their other equipment.","SOURCE":"Orlock Pack"},{"NAME":"Intimidation","RESTRICTION":"Orlock","CONDITIONS":"Play instead of activating a fighter.","EFFECT":"Choose an Active fighter from your gang. Each Active enemy fighter within 9’’ of that fighter must make a Nerve test. If a fighter fails the check, they run for cover as normal, but are not Broken.","SOURCE":"Orlock Pack"},{"NAME":"Lead by Example","RESTRICTION":"Orlock","CONDITIONS":"Play this when a Leader or Champion from your gang takes an enemy model Out of Action in close combat.","EFFECT":"Any Broken fighter from your gang immediately rally. In addition, any Pinned fighters from your gang within 6’’ of the Leader or Champion can immediately return to standing.","SOURCE":"Orlock Pack"},{"NAME":"Master Switch","RESTRICTION":"Anyone","CONDITIONS":"Play this card instead of activating a fighter. Note: Zone Mortalis only.","EFFECT":"Every door on the board that does not have a door terminal either opens or closes. They must all do the same, i.e., this card cannot be used to open some doors and close others.","SOURCE":"Orlock Pack"},{"NAME":"Point-Blank Shot","RESTRICTION":"Anyone","CONDITIONS":"Play this card when a fighter makes a Fight action or a Charge action.","EFFECT":"Pick one of the fighter’s ranged weapons that does not have the Blast trait or Template trait. For the duration of this turn, that weapon can be used in close combat in the same way as a pistol.","SOURCE":"Orlock Pack"},{"NAME":"Sterner Stuff","RESTRICTION":"Anyone","CONDITIONS":"Play this card instead of activating a fighter.","EFFECT":"Make a Rally check for each Broken fighter in your gang, as though it was the End phase.","SOURCE":"Orlock Pack"},{"NAME":"Tech Override","RESTRICTION":"Anyone","CONDITIONS":"Play this card when a friendly fighter makes an Access Terminal action or Bypass Lock action, or when rolling to see if a friendly fighter triggers a booby trap.","EFFECT":"If making an Access Terminal action or Bypass Lock action, the intelligence check is passed automatically. If rolling to see whether a booby trap is triggered, you can choose the result instead of rolling.","SOURCE":"Orlock Pack"},{"NAME":"They're Everywhere!","RESTRICTION":"Anyone","CONDITIONS":"Play this card instead of activating a fighter.","EFFECT":"Each enemy fighter who is within 4’’ of two or more fighters from your gang must make a Cool check. If the check is failed, the enemy fighter is Pinned.","SOURCE":"Orlock Pack"},{"NAME":"You're Coming With Me!","RESTRICTION":"Anyone","CONDITIONS":"Play when a fighter is taken Out of Action by a close combat attack.","EFFECT":"The chosen fighter may make a single close combat attack against the enemy that took them Out of Action. They are then removed from play as normal.","SOURCE":"Orlock Pack"},{"NAME":"Avenging Ogryn","RESTRICTION":"Slave Ogryns","CONDITIONS":"Play this gang tactic when a friendly Slave Ogryn fighter is taken Out of Action by an attack made by an enemy fighter.","EFFECT":"Choose a friendly Slave Ogryn that is Standing and Active, and has a Ready marker on them. Until the end of this round, that fighter automatically passes any Nerve tests it has to make. In addition, the fighter immediately activates, interrupting the enmy fighter's turn, and performs their activation as normal. The fighter then loses their Ready marker.","SOURCE":"Slave Ogryn Pack"},{"NAME":"Freedom in Death","RESTRICTION":"Slave Ogryns","CONDITIONS":"Play this tactic when a friendly Slave Ogryn is taken Out of Action.","EFFECT":"Before removing this fighter from the battlefield, they may immediately make a free Shoot (Basic) action with a weapon with the Grenade trait they are equipped with that has the Blast (3\"/5\"/*) trait. The central hole of the Blast marker must be centered over this fighter and the attack automatically hits.","SOURCE":"Slave Ogryn Pack"},{"NAME":"Gene-bred","RESTRICTION":"Slave Ogryns","CONDITIONS":"Play this tactic at the start of the Deployment step of the pre-battle sequence, before any fighters have been deployed.","EFFECT":"Choose a Slave Ogryn fighter in your starting crew. Until the end of this battle, that fighter gains up to two Gene-smithing upgrades of your choice. These must be chosen from the Unborn Gene-smithed Upgrades but do not affect the fighter's Credit cost. Any upgrade that affects the fighter during the post-battle sequence will affect the Slave Ogryn fighter before the upgrade is removed.","SOURCE":"Slave Ogryn Pack"},{"NAME":"Hidden Loyalties","RESTRICTION":"Slave Ogryns","CONDITIONS":"Play this gang tacic at the start of the Deployment step of the pre-battle sequence, before any fighters have been deployed.","EFFECT":"Choose a fighter from your starting crew. Until the end of this battle, that fighter gains the Infiltrate skill.","SOURCE":"Slave Ogryn Pack"},{"NAME":"Limb from Limb","RESTRICTION":"Slave Ogryns","CONDITIONS":"Play this tactic when activating a friendly Slave Ogryn fighter.","EFFECT":"Until the End phase of this round, any weapons with the Melee trait the fighter carries gains the Sever trait.","SOURCE":"Slave Ogryn Pack"},{"NAME":"No, I'm Smarticus!","RESTRICTION":"Slave Ogryns","CONDITIONS":"Play this gang tactic during the Priority Phase of any round, after Roll for Priority, but before Ready Fighters.","EFFECT":"Until the End phase of this round, roll a D6 each time a friendly Slave Ogryn fighter with the Gang Leader special rule is the target os a Shoot (Basic) action. On a 3+, you may transfer any successful hites that result from that action to a friendly Slave Ogryn fighter within 3\" of the fighter with the Gang Leader special rule. Hits caused by a weapon with the Blast (3\"/5\"/*) trait are unaffected by this gang tactic.","SOURCE":"Slave Ogryn Pack"},{"NAME":"Not Today!","RESTRICTION":"Slave Ogryns","CONDITIONS":"Play this tactic when a friendly Slave Ogryn fighter is taken out of Action by an attack made with a ranged weapon.","EFFECT":"Before removing the fighter from the battlefield, they may immediately become Standing and make a free Charge (Double) action. Immediately after this action, and any subsequent Fight (basic) action made as part of the Charge (Double) action, is resolved, the fighter goes Out of Action as normal.","SOURCE":"Slave Ogryn Pack"},{"NAME":"Quicker Than They Look","RESTRICTION":"Slave Ogryns","CONDITIONS":"Play this gang tactic when activating a friendly Slave Ogryn fighter.","EFFECT":"Until the End phase of this round, this fighter doubles their base Move characteristic while making a Charge (Double) action.","SOURCE":"Slave Ogryn Pack"},{"NAME":"Reboot","RESTRICTION":"Slave Ogryns","CONDITIONS":"Play this gang tactic when a friendly Seriously Injured Lobo-slave fighter is activated.","EFFECT":"This Lobo-slave immediately removes any Flesh Wounds and becomes Standing and Active. However, until the end of this battle, decrease this Lobo-slave's Weapon Skill and Attacks by 1, to a minimum of 6+ and 1 respectively.","SOURCE":"Slave Ogryn Pack"},{"NAME":"Resurgent Threat","RESTRICTION":"Slave Ogryns","CONDITIONS":"Play this gang tactic during the End phase, before making any Bottle tests.","EFFECT":"Your gang immediately passes their Bottle test, without the need to roll a D6. In addition, you can choose who wins Priority in the next round.","SOURCE":"Slave Ogryn Pack"},{"NAME":"Slave Becomes Master","RESTRICTION":"Slave Ogryns","CONDITIONS":"Play this gang tactic at the start of the Deployment step of the pre-battle sequence, before any fighters have been deployed.","EFFECT":"Your gang may immediately recruit up to two Goliath (juve) fighters or one Goliath (Ganger) fighter. These fighters are recruited for free but will leave the gang at the end of this battle. Each fighter is equipped with a Frenzon collar and either a stub gun or a maul and an axe. These fighters are not counted towards your maximum crew size - they are taken in addition to your starting crew. If you donot have models available to represent these fighters, you may discard this gang tactic and select another.","SOURCE":"Slave Ogryn Pack"},{"NAME":"Strong and Steady","RESTRICTION":"Slave Ogryns","CONDITIONS":"Play this gang tactic when a friendly fighter is hit by a ranged attack, before they become Prone and Pinned.","EFFECT":"Immediately make a Strength test for the fighter. If it is passed, they do not become Pinned. This gang tactic can be played after a fighter has failed a Cool check as part of a Nerves of Steel skill.","SOURCE":"Slave Ogryn Pack"},{"NAME":"Tools of the Trade","RESTRICTION":"Slave Ogryns","CONDITIONS":"Play this gang tactic at the start of the battle, after both sides have deployed, but before the first round.","EFFECT":"Choose a fighter from your starting crew that is on the battlefield and place a marker on their Fighter card. Choose one weapon with the Melee trait that the fighter is equipped with. For the duration of this battle, the fighter's Weapon Skill is treated as 2+ when making attacks with that weapon.","SOURCE":"Slave Ogryn Pack"},{"NAME":"Die on Your Feet","RESTRICTION":"Slave Ogryns","CONDITIONS":"Play this gang tactic at the start of the battle, after both sides have deployed, but before the first round.","EFFECT":"Until the end of this battle, when a friendly Slave Ogryn fighter is the target of a Coup De Grace (simple) action, they take D3 Flesh Wounds instead of going Out of Action. The Slave Ogryn is then immediately moved 1\" directly away from the fighter performing the action and is placed Prone and Pinned - they are no longer Seriously Injured.","SOURCE":"Slave Ogryn Pack"},{"NAME":"Looted Gear","RESTRICTION":"Slave Ogryns","CONDITIONS":"Play this gang tactic at the start of the Deployment step of the pre-battle sequence, before any fighters have been deployed.","EFFECT":"Choose a fighter from your starting crew that is on the battlefield and place a marker on that fighter's card. Until the end of this battle, a single weapon that fighter is equipped with loses one of the following traits: Reckless, Scarce, Unwieldy. You may choose which weapon is affected by this gang tactic and which Trait is lost.","SOURCE":"Slave Ogryn Pack"},{"NAME":"Out Of My Way!","RESTRICTION":"Slave Ogryns","CONDITIONS":"Play this tactic when activating a friendly Slave Ogryn fighter.","EFFECT":"UIntil the End of this round, the fighter gains the Hurl skill if they did not already have it. In addition, the Hurl (Basic) action becomes a Hurl (Simple) action for this fighter. Any enemy fighter that is the target of this action must take a Strength check rather than an Initiative check; if they fail, the enemy fighter is hurled.","SOURCE":"Slave Ogryn Pack"},{"NAME":"Chain Breaker","RESTRICTION":"Slave Ogryns","CONDITIONS":"Play this gang tactic at the start of the battle, after both sideshave deployed, but before the first round.","EFFECT":"Until the end of this battle, do not roll Recovery tests for any friendly Slave Ogryn fighters that are Webbed. Instead, treat them as having rolled a Flesh Wound result and they immediately become Standing. If your opponent does not have any fighters armed with weapons with the Web trait, you may discard this gang tactic and select another. Alternatively, if the battle is part of a campaign, friendly fighters cannot be captured during the post-battle sequence; any fighter that is captured counts as having rolled an Out Cold result on the Lasting Injuries table.","SOURCE":"Slave Ogryn Pack"},{"NAME":"Unleash the Storm","RESTRICTION":"Slave Ogryns","CONDITIONS":"Play this gang tactic when a friendly Slave Ogryn fighter makes an attack with a Storm-welder, before rolling any dice.","EFFECT":"Until the End phase of this round, the Storm-welder loses the Reckless trait. However, at the end of this fighter's activation, the weapon immediately goes Out of Ammo as if they had rolled the Ammo symbol on the Firepower dice; this counts as an additional roll of the Ammo symbol for the purposes of the Storm-welder's Unstable trait.","SOURCE":"Slave Ogryn Pack"},{"NAME":"Grenade Bouquet","RESTRICTION":"Anyone","CONDITIONS":"Play this card when a fighter makes an attack with a grenade that has a Blast trait.","EFFECT":"The fighter may immediately make three attacks with this type of grenade, rather than the usual one. Each of these attacks counts as a miss and so will automatically scatter. Once all three attacks are resolved, the fighter will automatically fail the Ammo check and run out of grenades of that type.","SOURCE":"Underdog Pack"},{"NAME":"Last Round","RESTRICTION":"Anyone","CONDITIONS":"Play this card when activating a fighter that has one or more Out of Ammo markers on them.","EFFECT":"Choose one of this fighter’s ranged weapons that is Out of Ammo. The fighter immediately performs a Shoot (Basic) action with that weapon that will hit automatically. Do not roll an Ammo Dive - the weapon remains Out of Ammo. Weapons with the Rapid Fire (X) trait make only one shot.","SOURCE":"Underdog Pack"},{"NAME":"Bullet Magnet","RESTRICTION":"Anyone","CONDITIONS":"Play this card when a fighter fires a weapon with the Rapid Fire trait.","EFFECT":"Add 1 to the number of hits rolled on each Firepower dice.","SOURCE":"Underdog Pack"},{"NAME":"Counter-Assault","RESTRICTION":"Anyone","CONDITIONS":"Play this card when one of your fighters makes a Reaction attack.","EFFECT":"The fighter’s Reaction attacks are made at +1 to Hit. In addition, they automatically pass the Initiative check required to make Reaction attacks against disengaging enemy.","SOURCE":"Underdog Pack"},{"NAME":"Machine Curse","RESTRICTION":"Anyone","CONDITIONS":"Play this card instead of activating a fighter.","EFFECT":"Choose an enemy fighter. They must immediately make an Ammo check of each of their ranged weapons.","SOURCE":"Underdog Pack"},{"NAME":"Makeshift Cover","RESTRICTION":"Anyone","CONDITIONS":"Play this card at the start of any round.","EFFECT":"Place D3 barricades or similar pieces of terrain anywhere on the battlefield within 3” of one of your fighters.","SOURCE":"Underdog Pack"},{"NAME":"Rejuve Stimm","RESTRICTION":"Anyone","CONDITIONS":"Play this card instead of activating a fighter.","EFFECT":"Choose any friendly fighter who has suffered at least one Wound. This fighter immediately regains any lost Wounds.","SOURCE":"Underdog Pack"},{"NAME":"Sacrifice","RESTRICTION":"Anyone","CONDITIONS":"Play this card when a fighter is hit by a ranged attack.","EFFECT":"Nominate a friendly fighter within 2” of the fighter who has been hit. The nominated fighter becomes the target of the ranged attack instead.","SOURCE":"Underdog Pack"},{"NAME":"Spreading Conflagration","RESTRICTION":"Anyone","CONDITIONS":"Play this card at the start of any round.","EFFECT":"For the duration of this round, fighters activating within 3” of a fighter that is subject to the Blaze condition must test to see if they catch fire, just as if they had been hit by a weapon with the Blaze trait.","SOURCE":"Underdog Pack"},{"NAME":"Unstable Energy","RESTRICTION":"Anyone","CONDITIONS":"Play this card when an enemy fighter armed with a las, plasma or melta weapon of any type makes an attack with that weapon.","EFFECT":"For the remainder of this round, all enemy weapons of the same type (las, plasma or melta) gain the Unstable trait if they do not already have it. If they already have the Unstable trait, they gain the Scarce trait.","SOURCE":"Underdog Pack"},{"NAME":"Beast Repellent","RESTRICTION":"Anyone","CONDITIONS":"Play this card when activating a fighter.","EFFECT":"For the duration of this fighter’s activation, they do not risk rousing the Beast, regardless of how close they are to the Beast’s Lair.","SOURCE":"Underdog Pack"},{"NAME":"Reload!","RESTRICTION":"Anyone","CONDITIONS":"Play this card in the End phase of any round.","EFFECT":"Immediately make a Reload (Simple) action for any or all of your fighters.","SOURCE":"Underdog Pack"},{"NAME":"…Click","RESTRICTION":"Anyone","CONDITIONS":"Play this card after an enemy fighter completes an attack with a ranged weapon.","EFFECT":"The weapon immediately runs Out of Ammo, as if it had failed an Ammo Check.","SOURCE":"Underhive Box"},{"NAME":"Brutal Charge","RESTRICTION":"Goliath","CONDITIONS":"Play this card when one of your fighters makes a Charge action.","EFFECT":"For the duration of the action, the fighter's Movement characteristic is increased by 2’’, and their Attacks characteristic is increased by 1. In addition, any attacks they make gain the Knockback trait.","SOURCE":"Underhive Box"},{"NAME":"Inhuman Resilience","RESTRICTION":"Goliath","CONDITIONS":"Play this card instead of activating a fighter on your turn.","EFFECT":"Each of your Pinned fighters immediately stands up. Then make a Recovery roll for each Injured fighter in your gang, treating Out of Action results as Seriously Injured.","SOURCE":"Underhive Box"},{"NAME":"Last Gasp","RESTRICTION":"Anyone","CONDITIONS":"Play this card when one of your active fighters is taken Out of Action.","EFFECT":"Before the fighter is removed from play, they can immediately make an attack. This is a close combat attack if they are Engaged, otherwise it is a ranged attack. If they are equipped with a grenade that has the Blast trait, and the Blast marker is centred on them, it will not scatter. As soon as the attack has been resolved, the fighter is removed from play.","SOURCE":"Underhive Box"},{"NAME":"Rigged Door","RESTRICTION":"Anyone","CONDITIONS":"Play this card immediately after an enemy fighter makes an action. Note: Zone Mortalis only.","EFFECT":"Pick any door on the board and either close or open it. If closing a door and there is a fighter standing in the doorway, they must test to see whether they avoid closing door as normal.","SOURCE":"Underhive Box"},{"NAME":"Stealthy Advance","RESTRICTION":"Escher","CONDITIONS":"Play this card after both gangs have been set up at the start of the battle, before the first round begins.","EFFECT":"Up to half of the fighters in your crew (rounding up) can immediately make a Standard Move.","SOURCE":"Underhive Box"},{"NAME":"Stimm Surge","RESTRICTION":"Goliath","CONDITIONS":"Play this card when activating a fighter.","EFFECT":"Tuck this card under the Fighter's card. While it is there , the fighter's Move, Strength and Toughness are each increased by 1. In each End phase, roll a D6. On a 1, the card is discarded and an Injury roll is made for the fighter, using a Damage of 2. On a 2, the card is discarded. On a 3, the fighter suffers a Flesh Wound but the card remains in play.","SOURCE":"Underhive Box"},{"NAME":"Unstoppable Behemoth","RESTRICTION":"Goliath","CONDITIONS":"Play this card after an attack is made against on of your fighters, before the Injury roll (if any) is made.","EFFECT":"The attack has no further effect – no Injury roll is made. In addition, if your fighter is pinned, they immediately stand up.","SOURCE":"Underhive Box"},{"NAME":"Blood Debt","RESTRICTION":"Anyone","CONDITIONS":"Play this card when one of your fighters is taken Out of Action by an enemy fighter's attack.","EFFECT":"For the rest of the battle, add 1 to the result of any hit rolls for fighters from your gang when they target the attacker. Tuck this card under the attacker’s Fighter card as a reminder.","SOURCE":"Underhive Box"},{"NAME":"Counter-Charge","RESTRICTION":"Escher","CONDITIONS":"Play this card when an enemy fighter makes a Charge action, after they move but before they make their attacks.","EFFECT":"Pick a Readied fighter from your gang. They can make a Standard Move (adding D3’’ to the distance they can move, as though they were charging) towards the enemy fighter who charged. The counter-charging fighter cannot make any attacks, but they can make Reaction attacks and grant assists/interference as normal.","SOURCE":"Underhive Box"},{"NAME":"Gas Trap","RESTRICTION":"Escher","CONDITIONS":"Play this at the start of the battle when setting up your gang.","EFFECT":"Pick any of your fighters to carry the frag trap, and put this card under their Fighter card. Once during the game, the fighter, as long as they are Active, can make this action: Set Gas Trap (Double) – Place a Gas Trap marker within 1’’ of the fighter. Then they can move up to D6’’. If the fighter goes Out of Action before making this action, roll a D6. On a 1, the trap triggered (centred on the fighter's base). On a 2-3, place a Gas Trap marker where the fighter stood. On a 4+, discard this card.","SOURCE":"Underhive Box"},{"NAME":"Group Tactics","RESTRICTION":"Anyone","CONDITIONS":"Play this card when it is your turn, before activating any fighters.","EFFECT":"Instead of activating one fighter, activate up to three fighters (in the same way as making a Group activation).","SOURCE":"Underhive Box"},{"NAME":"Lucky Find","RESTRICTION":"Anyone","CONDITIONS":"Play this card when activating a fighter with a weapon that is Out of Ammo.","EFFECT":"One of the fighter's weapons is automatically reloaded at the cost of one action – no Ammo check is required.","SOURCE":"Underhive Box"},{"NAME":"Makeshift Armour","RESTRICTION":"Anyone","CONDITIONS":"One of your fighters can spend an action to play this card.","EFFECT":"Tuck this card under the fighter's card; while it is there, their armour save is treated as one point better than it is. If any save roll for the fighter is a 1 (before modifiers), discard this card after resolving the attack(s).","SOURCE":"Underhive Box"},{"NAME":"Melta Trap","RESTRICTION":"Anyone","CONDITIONS":"Play this at the start of the battle, when setting up your gang.","EFFECT":"Pick any of your fighters to carry the frag trap, and put this card under their Fighter card. Once during the game, the fighter, as long as they are Active, can make this action: Set Melta Trap (Double) – Place a Melta Trap marker within 1’’ of the fighter. Then they can move up to D6’’. If the fighter goes Out of Action before making this action, roll a D6. On a 1, the trap triggered (centred on the fighter's base). On a 2-3, place a Melta Trap marker where the fighter stood. On a 4+, discard this card.","SOURCE":"Underhive Box"},{"NAME":"Frag Trap","RESTRICTION":"Anyone","CONDITIONS":"Play this at the start of the battle, when setting up your gang.","EFFECT":"Pick any of your fighters to carry the frag trap, and put this card under their Fighter card. Once during the game, the fighter, as long as they are Active, can make this action: Set Frag Trap (Double) – Place a Frag Trap marker within 1’’ of the fighter. Then they can move up to D6’’. If the fighter goes Out of Action before making this action, roll a D6. On a 1, the trap triggered (centred on the fighter's base). On a 2-3, place a Frag Trap marker where the fighter stood. On a 4+, discard this card.","SOURCE":"Underhive Box"},{"NAME":"Hidden Passage","RESTRICTION":"Anyone","CONDITIONS":"Play this card at the start of your turn, immediately before activating a fighter. Note: Zone Mortalis only.","EFFECT":"Place an unused Ductway marker anywhere on the board, following the normal rules for placing a ductway.","SOURCE":"Underhive Box"},{"NAME":"Scrag","RESTRICTION":"Escher","CONDITIONS":"Play this card after one of your fighters puts an enemy out of action in close combat.","EFFECT":"Enemy fighters must make a Nerve test if they are within 9’’ rather than 3’’ (they must still be visible). In addition, subtract 2 from the result of any Nerve tests made for fighters within 3’’.","SOURCE":"Underhive Box"},{"NAME":"A Few Friends","RESTRICTION":"Underhive Outcasts","CONDITIONS":"Play this gang tactic at the start of the battle, after both sides have deployed, but before the first round.","EFFECT":"Your gang may immediately recruit and place in your deployment zone d3+2 Hive Scum Hired Guns. These fighters are recruited for free and will leave your gang at the end of this battle. These fighters are not counted towards your maximum crew size - they are taken in addition to your starting crew. If you do not have additional models available to represent these Hive Scum, you may discard this gang tactic and select another.","SOURCE":"Underhive Outcasts Pack"},{"NAME":"All or Nothing","RESTRICTION":"Underhive Outcasts","CONDITIONS":"Play this gang tactic when activating a friendly fighter.","EFFECT":"The fighter (who may be Seriously Injured) immediately becomes Standing and Active and may perform up to three actions during this activation. Once their activation ends, they immediately go out of Action.","SOURCE":"Underhive Outcasts Pack"},{"NAME":"Dirty Tactics","RESTRICTION":"Underhive Outcasts","CONDITIONS":"Play this gang tactic at the end of a friendly fighter's activation.","EFFECT":"Immediately activate another Ready friendly fighter anywhere on the battlefield.","SOURCE":"Underhive Outcasts Pack"},{"NAME":"It's Personal","RESTRICTION":"Underhive Outcasts","CONDITIONS":"Play this gang tactic at the start of any round before players Roll of Priority.","EFFECT":"Choose one enemy fighter currently on the battlefield and mark them with a token. For the remainder of the battle, all friendly fighters add 1 to any Weapon Skill or Ballistic Skill checks made against the marked fighter.","SOURCE":"Underhive Outcasts Pack"},{"NAME":"More Where They Came From","RESTRICTION":"Underhive Outcasts","CONDITIONS":"Play this tactic during any End phase, before your opponent makes any Recovery tests.","EFFECT":"You may return to play d3 friendly Gangers/Juves that have been taken Out of Action but did not suffer a Memorable Death result on the Lasting Injury table by placing them in your gang's deployment zone. These fighters retain any injuries suffered for going Out of Action but discard any Flesh Wounds.","SOURCE":"Underhive Outcasts Pack"},{"NAME":"Old Faithful","RESTRICTION":"Underhive Outcasts","CONDITIONS":"Play this gang tactic when a friendly fighter targets an enemy fighter with a ranged or close combat attack.","EFFECT":"Choose either a ranged or a melee weapon from the Trading Post with a Rarity of 9 or less. Count this attack as if the fighter was armed with the chosen weapon.","SOURCE":"Underhive Outcasts Pack"},{"NAME":"Rise from the Ashes","RESTRICTION":"Underhive Outcasts","CONDITIONS":"Play this gang tactic at the start of any round before players Roll of Priority.","EFFECT":"For the duration of this round and the following two rounds, your gang automatically passes all Bottle tests.","SOURCE":"Underhive Outcasts Pack"},{"NAME":"Wyrd Occurrance","RESTRICTION":"Underhive Outcasts","CONDITIONS":"Play this gang tactic when activating a friendly fighter.","EFFECT":"This fighter immediately performs one of the following Wyrd Power actions (without the need to make a Willpower check). Their activation then ends: Chronomancy - Freeze Time (Double), Divination - Misfortune (Basic), Pyromancy - Molten Bolt (Basic)","SOURCE":"Underhive Outcasts Pack"},{"NAME":"Back to the Badzones","RESTRICTION":"Underhive Outcasts","CONDITIONS":"Play this gang tactic during any End phase, before your opponent makes any Recovery tests.","EFFECT":"The battle ends as if your gang had retreated from the battlefield. Friend;y fighters who are Seriously Injured autmatically recover and there is no chance for any fighters to be Captured.","SOURCE":"Underhive Outcasts Pack"},{"NAME":"Fight Another Day","RESTRICTION":"Underhive Outcasts","CONDITIONS":"Play this gang tactic when a friendly fighter is taken Out of Action.","EFFECT":"Do not make a Lasting Injury roll against the fighter. Instead, treat the fighter as being Out Cold, as if a roll of 12-26 on the Lasting Injury table had been made against them.","SOURCE":"Underhive Outcasts Pack"},{"NAME":"Hard Rounds","RESTRICTION":"Underhive Outcasts","CONDITIONS":"Play this gang tactic at the start of any round before players Roll of Priority.","EFFECT":"For the duration of both this round and the next, both players must roll 2d6 when taking a Bottle test, rather than the usual d6.","SOURCE":"Underhive Outcasts Pack"},{"NAME":"No Masters","RESTRICTION":"Underhive Outcasts","CONDITIONS":"Play this gang tactic when a friendly fighter is required to make a Leadership, Cool, Intelligence, or Willpower check.","EFFECT":"The fighter can use the Leadership, Cool, Intelligence, or Willpower of your gang's Leader, even if the Leader is not currently on the battlefield.","SOURCE":"Underhive Outcasts Pack"},{"NAME":"Undercover Agent","RESTRICTION":"Underhive Outcasts","CONDITIONS":"Play this gang tactic when activating a friendly fighter.","EFFECT":"This fighter can shoose to replace their characteristics profile with that of a friendly fighter that is currently on the battlefield. At the end of the activation, this fighter goes Out of Action.","SOURCE":"Underhive Outcasts Pack"},{"NAME":"Honourless Victory","RESTRICTION":"Underhive Outcasts","CONDITIONS":"Play this gang tactic at the end of the scenario.","EFFECT":"Regardless of the scenario rewards, your gang does not suffer any loss of Reputation.","SOURCE":"Underhive Outcasts Pack"},{"NAME":"Lucky Score","RESTRICTION":"Underhive Outcasts","CONDITIONS":"Play this gang tactic at the end of the scenario.","EFFECT":"If the scenario included any reward in the form of credits, your gang adds an extra d6x10 credits in addition to those won.","SOURCE":"Underhive Outcasts Pack"},{"NAME":"Temporary Alliance","RESTRICTION":"Underhive Outcasts","CONDITIONS":"Play this gang tactic at the start of the battle, after both sides have deployed, but before the first round.","EFFECT":"Choose one Alliance normally available to your gang (e.g. Noble, Criminal, Guild, etc.). Your gang gains the effects of this Alliance for the duration of the battle. This tactic may not be used if your gang is already in an Alliance.","SOURCE":"Underhive Outcasts Pack"},{"NAME":"We Never Liked Him Anyway","RESTRICTION":"Underhive Outcasts","CONDITIONS":"Play this gang tactic when a friendly fighter is taken Out of Action.","EFFECT":"The fighter automatically suffers a Memorable Death as if a 66 had been made against them on the Lasting Injury table. The fighter's cost in credits is then added to your stash.","SOURCE":"Underhive Outcasts Pack"},{"NAME":"Worthless","RESTRICTION":"Underhive Outcasts","CONDITIONS":"Play this gang tactic when a friendly fighter is taken Out of Action.","EFFECT":"No XP is gained for the fighter being taken Out of Action. In addition, do not count this fighter as having been taken Out of Action when determining scenario rewards.","SOURCE":"Underhive Outcasts Pack"},{"NAME":"Hive Tremors","RESTRICTION":"Anyone","CONDITIONS":"Play at the start of any round.","EFFECT":"Every Active fighter on the table must make an Initiative test – any who fail are Pinned. After all fighters have tested, place D3 additional loot caskets anywhere on the table not within 6’’ of a fighter. Finally, if the game uses a Zone Mortalis scenario, place D3 spare ductways across any walls of your choice. If the game uses a Sector Mechanicus scenario, remove D3 ladders of your choice.","SOURCE":"Underhive Pre-Order"},{"NAME":"Ablative Mesh","RESTRICTION":"Van Saar","CONDITIONS":"Play this gang tactic when a friendly Van Saar fighter suffers a hit from any weapon with a Strength characterisitc other than '-'.","EFFECT":"Treat this hit as having been caused by a weapon with the Knockback trait but do not resolve the hit itself. Instead, the hit is discarded.","SOURCE":"Van Saar (HoA) Pack"},{"NAME":"Bodyguard","RESTRICTION":"Van Saar","CONDITIONS":"Play this gang tactic at the start of the Deployment Step of the pre-battle sequence, before any of the fighters have been deployed.","EFFECT":"One fighter with the Gang Fighter (X) belonging to your gang that is not part of your starting crew may be added to your starting crew. Nominate a Leader or Champion within your crew. For the duration of this battle, the chosen Gang Fighter (X) follows the rules for Exotic Beasts, as if they were owned by the chosen Leader and Champion.","SOURCE":"Van Saar (HoA) Pack"},{"NAME":"Defensive Protocols","RESTRICTION":"Van Saar","CONDITIONS":"Play this gang tactic when a Leader or Champion belonging to your gang is hit by a ranged attack, before the hit is resolved.","EFFECT":"You may choose to tranfer the hit and all of its effects onto any friendly fighter with the Gang Fighter (X) special rule that is within 2\" of the Leader or Champion that was hit.","SOURCE":"Van Saar (HoA) Pack"},{"NAME":"Feigned Nobility","RESTRICTION":"Van Saar","CONDITIONS":"Play this gang tactic at the start of the Deployment Step of the pre-battle sequence, before any of the fighters have been deployed.","EFFECT":"Your gang may be joined by either a House Agent or Dramatis Personae. This fighter will leave the gang at the end of this battle. The fighter is not counted towards your maximum crew size - they are taken in addition to your starting crew. If you do not have a model available to represent this fighter, you may discard this card and draw another. If this fighter is taken Out of Action, every friend;y fighter suffers a -2 to their Cool for the remainder of the battle. Additionally, if this battle is part of a campaign, your gang loses 5 Reputation (to a minimum of zero), and the gang that takes this fighter Out of Action gains 3 Reputation, at the end of the battle.","SOURCE":"Van Saar (HoA) Pack"},{"NAME":"Medical Intervention","RESTRICTION":"Van Saar","CONDITIONS":"Play this gang tactic during any End phase, before making any Recovery tests.","EFFECT":"Choose one Seriously Injured friendly Van Saar fighter. Do not make a Recovery test for this fighter. Instead, this fighter immediately recovers, exactly as if a Flesh Wound result had been rolled for them.","SOURCE":"Van Saar (HoA) Pack"},{"NAME":"Power Up","RESTRICTION":"Van Saar","CONDITIONS":"Play this gang tactic when a friendly Van Saar fighter makes an attack using any form of 'las' weapon.","EFFECT":"For the duration of this action, the Strength characterisitic of the weapon used is doubled.","SOURCE":"Van Saar (HoA) Pack"},{"NAME":"Tracer Fire","RESTRICTION":"Van Saar","CONDITIONS":"Play this gang tactic during the Priority phase of any round, after Roll for Priority, but before Ready Fighters.","EFFECT":"For the duration of this round, any friendly fighter that performs a Shoot (basic) or Shoot (double) action as part of a Group Activation may apply a +1 modifier to their Ballistic Skill for the duration of this activation.","SOURCE":"Van Saar (HoA) Pack"},{"NAME":"Unexpected Allies","RESTRICTION":"Van Saar","CONDITIONS":"Play this gang tactic at the start of the Deployment Step of the pre-battle sequence, before any of the fighters have been deployed.","EFFECT":"Your gang may immediately recruit up to three Subteks. These fighters are recruited for free, but will leave the gang at the end of this battle. Each Subtek is armed with either a lasgun or two laspistols. These fighters are not counted towards your maximum crew size - they are taken in addition to your starting crew. If you do not have models available to represent these fighters, you may discard this gang tactic and select another.","SOURCE":"Van Saar (HoA) Pack"},{"NAME":"Ammo Dump","RESTRICTION":"Van Saar","CONDITIONS":"Play this gang tactic at the start of the Deployment Step of the pre-battle sequence, before any of the fighters have been deployed.","EFFECT":"Place an additional Ammo crate anywhere on the battlefield. Any fighter that activates whilst within 3\" of this Ammo crate that is not Seriously Injured and that has a weapon that is currently Out of Ammo may immediately make a free Reload (simple) action. A fighter can make this action even if they would normally be unable to do so, for example, if an Out of ammo weapon has the Scarce trait.","SOURCE":"Van Saar (HoA) Pack"},{"NAME":"Data Mining","RESTRICTION":"Van Saar","CONDITIONS":"Play this gang tactic at the start of the battle, after both sides have deployed, but before the first round.","EFFECT":"Your opponent must immediately reveal to you thir remaining, unplayed gang tactics. After reading your opponent's gang tactics, choose, one. Your opponent must immediately discard the chosen gang tactic and randomly select another.","SOURCE":"Van Saar (HoA) Pack"},{"NAME":"Longshot","RESTRICTION":"Van Saar","CONDITIONS":"Play this gang tactic when a friendly Van Saar fighter makes a Shoot (basic) action, before rolling any of the dice.","EFFECT":"For the duration of this action, this fighter's BS is 2+. In addition, for the duration of this action, this fighter ignores all negative modifiers that may apply to their hit rolls. However, after resolving the attack, the weapon is immediately Out of Ammo.","SOURCE":"Van Saar (HoA) Pack"},{"NAME":"Rad-clouds","RESTRICTION":"Van Saar","CONDITIONS":"Play this gang tactic at the start of the battle, after both sides have deployed, but before the first round.","EFFECT":"Place d3 markers anywhere on the abttlefield, more than 6\" away from an enemy fighter. These markers represent pockets of radiation. Roll a d6 for any fighter, friend or foe, that does not belong to House Van Saar that ends their activation within 3\" of the center of one of these markers. On a 5 or 6, that fighter immediately suffers a Flesh Wound. At the start of each End phase, roll a d6 for each marker. On a 1, the marker is removed.","SOURCE":"Van Saar (HoA) Pack"},{"NAME":"Security Override","RESTRICTION":"Van Saar","CONDITIONS":"If your gang is the attacker, play this gang tactic during the Priority phase of any round, after Roll for Priority, but before Ready Fighters. If your gang is not the attacker, discard this gang tactic and select another.","EFFECT":"Every closed door on the battlefield immediately opens. Every locked door on the battlefield immmediately unlockls and opens. Every door terminal on the battlefield immediately ceases to function (any may be removed). If there are fewer than three doors on the battlefield, you may discard this gang tactic and select another.","SOURCE":"Van Saar (HoA) Pack"},{"NAME":"Shut-in","RESTRICTION":"Van Saar","CONDITIONS":"If your gang is the defender, play this gang tactic during the Priority phase of any round, after Roll for Priority, but before Ready Fighters. If your gang is not the defender, discard this gang tactic and select another.","EFFECT":"Every door on the battlefield immediately closes. Every door on the battlefield that has a door terminal becomes locked. Every closed door on the battlefield that does not have a door terminal also becomes locked, but can only be opened with force, either by targeting them with attacks or by performing a Dorce Door (basic) action against them. If there are fewer than three doors on the battlefield, you may discard this gang tactic and select another.","SOURCE":"Van Saar (HoA) Pack"},{"NAME":"Weakened Physiology","RESTRICTION":"Van Saar","CONDITIONS":"Play this gang tactic during any End phase, before making any Recovery tests.","EFFECT":"Choose one Seriously Injured fighter belonging to the enemy gang. Your opponent must roll for one extra Injury dice when making a Recovery test for this fighter. In addition, you may choose which Injury dice result is resolved and which are discarded.","SOURCE":"Van Saar (HoA) Pack"},{"NAME":"Weapon Drill","RESTRICTION":"Van Saar","CONDITIONS":"Play this gang tactic at the start of the battle, after both sides have deployed, but before the first round.","EFFECT":"For the duration of this battle, you may re-rll any rolls of a natural 1 made when making an Ammo check.","SOURCE":"Van Saar (HoA) Pack"},{"NAME":"Arachni-ropes","RESTRICTION":"Van Saar","CONDITIONS":"Play this gang tactic at the start of the battle, after both sides have deployed, but before the first round.","EFFECT":"For the duration of this battle, d6 friendly fighters of your choice in your starting crew count as being equipped with grav chutes (make a note of this on the chosen fighters' Fighter cards).","SOURCE":"Van Saar (HoA) Pack"},{"NAME":"Enhanced Cyberteknika","RESTRICTION":"Van Saar","CONDITIONS":"Play this gang tactic at the start of the Deployment Step of the pre-battle sequence, before any of the fighters have been deployed.","EFFECT":"For the duration of this battle, any fighters in your gang equipped with a piece of Cyberteknika may treat that piece of Cyberteknika as being the next level up. For example, a fighter equipped with a piece of Alpha Cyberteknika counts as being equipped with the Gamma level equivalent for the duration of this battle. Fighters with Omega level Cyberteknika gain no benefit.","SOURCE":"Van Saar (HoA) Pack"},{"NAME":"Auto-Healer","RESTRICTION":"Van Saar","CONDITIONS":"Play this card at the start of any End phase.","EFFECT":"Choose one Seriously Injured fighter. Rather than rolling the Injury dice, you can choose to have the fighter suffer a Flesh Wound and become Pinned.","SOURCE":"Van Saar Pack"},{"NAME":"Dangerous Footing","RESTRICTION":"Anyone","CONDITIONS":"Play when your opponent activates a fighter.","EFFECT":"Immediately place a Pitfall Crater marker beneath the fighter. The fighter must take an Initiative test. If the test is passed, the fighter makes a Move action to safety and their activation continues. If the Initiative test is failed, the fighter falls into the crater and is immediately taken Out of Action. The pitfall Crater remains in place for the duration of the battle.","SOURCE":"Van Saar Pack"},{"NAME":"Rapid Fire","RESTRICTION":"Van Saar","CONDITIONS":"Play this card when activating a fighter.","EFFECT":"This fighter can perform a free Shoot (Basic) action during its activation. This free action is in addition to its two normal actions.","SOURCE":"Van Saar Pack"},{"NAME":"Seize the Initiative","RESTRICTION":"Anyone","CONDITIONS":"Play this card at the beginning of any round, before rolling for Priority.","EFFECT":"You immediately take Priority this turn without any dice being rolled.","SOURCE":"Van Saar Pack"},{"NAME":"Blood Cleansers","RESTRICTION":"Van Saar","CONDITIONS":"Play at the start of any turn.","EFFECT":"For the duration of the round, all friendly models count their Toughness as 1 higher when affected by weapons with the Toxin or Gas traits.","SOURCE":"Van Saar Pack"},{"NAME":"Combat Drugs","RESTRICTION":"Anyone","CONDITIONS":"Play when a fighter makes a melee attack.","EFFECT":"For the duration of this turn, the fighter gains D3 additional attacks. However, should the fighter gain the full 3 additional attacks, they will automatically suffer a Flesh Wound at the end of their activation.","SOURCE":"Van Saar Pack"},{"NAME":"Comm Burst","RESTRICTION":"Van Saar","CONDITIONS":"Play at the start of any turn.","EFFECT":"For this round, your gang’s Leader can make Rally actions for Broken fighters anywhere on the board. In addition, the range of Leading by Example is increased to 18’’ for Leaders and 12’’ for Champions.","SOURCE":"Van Saar Pack"},{"NAME":"Enhanced Auspexes","RESTRICTION":"Van Saar","CONDITIONS":"Play instead of activating a fighter.","EFFECT":"For the remainder of the round, friendly fighters may fire through line of sight blocking terrain such as doors and barricades, but NOT through any impassable terrain. These shots suffer a -2 penalty to hit and the target’s armour save is increased by 1.","SOURCE":"Van Saar Pack"},{"NAME":"Experimental Rig","RESTRICTION":"Van Saar","CONDITIONS":"Play at the start of the game, after both sides have deployed.","EFFECT":"Choose a weapon possessed by a friendly fighter. For the duration of the game, this weapon increases its Long range by 6’’ and its Strength by 1, but loses the Plentiful trait if it has it, and gains the Scarce trait if it doesn't have it.","SOURCE":"Van Saar Pack"},{"NAME":"Fall Back","RESTRICTION":"Anyone","CONDITIONS":"Play this card when activating a fighter.","EFFECT":"This fighter may immediately make a Retreat (Basic) action without having to make an Initiative check. Additionally, each enemy fighter that was Engaging them is unable to make any Reaction attacks.","SOURCE":"Van Saar Pack"},{"NAME":"Hyper Auto-Loader","RESTRICTION":"Van Saar","CONDITIONS":"Play when a fighter makes a ranged attack.","EFFECT":"If the fighter is using a weapon with the Rapid Fire trait, they may roll 2 extra Firepower dice. After working out the effects of the shot, their ranged weapon automatically counts as having failed an Ammo check, regardless of the results of the Firepower dice.","SOURCE":"Van Saar Pack"},{"NAME":"Medical Protocols","RESTRICTION":"Van Saar","CONDITIONS":"Play at the start of any End phase.","EFFECT":"For the duration of this End phase, when any fighter assists a friendly fighter’s Recovery test, roll an extra Injury dice, then choose one to keep.","SOURCE":"Van Saar Pack"},{"NAME":"Mesh Underlay","RESTRICTION":"Van Saar","CONDITIONS":"Play when a fighter is hit by a ranged attack.","EFFECT":"For the remainder of the battle, the chosen fighter's armour saves are not modified by AP when hit by a ranged attack.","SOURCE":"Van Saar Pack"},{"NAME":"Overcharge","RESTRICTION":"Van Saar","CONDITIONS":"Play when a fighter makes a ranged attack.","EFFECT":"For the duration of the fighter's activation, one of their Las or Plasma ranged weapons increases its Strength by 2.","SOURCE":"Van Saar Pack"},{"NAME":"Warforge","RESTRICTION":"Van Saar","CONDITIONS":"Play at the start of the game, after both sides have deployed.","EFFECT":"For the duration of this battle, all friendly models add a +1 modifier to any Ammo checks they are required to take.","SOURCE":"Van Saar Pack"},{"NAME":"Cortical Stimulants","RESTRICTION":"Van Saar","CONDITIONS":"Play at the start of the game, after deployment.","EFFECT":"One fighter in your gang automatically passes Intelligence checks for the duration of the battle.","SOURCE":"Van Saar Pack"},{"NAME":"Nerves of Steel","RESTRICTION":"Anyone","CONDITIONS":"Play when a fighter makes a ranged attack.","EFFECT":"The fighter may ignore normal Target Priority rules and may instead target any eligible enemy fighter they wish without having to pass a Cool check.","SOURCE":"Van Saar Pack"},{"NAME":"Pneumatic Injectors","RESTRICTION":"Van Saar","CONDITIONS":"Play when a fighter makes a melee attack.","EFFECT":"For the duration of the fighter's activation, one of their melee weapons increases its Strength by 2.","SOURCE":"Van Saar Pack"},{"NAME":"Slippery","RESTRICTION":"Anyone","CONDITIONS":"Play this card when activating a fighter.","EFFECT":"Put this card under the active fighter's Fighter card. Until the end of the battle, this fighter treats the Crawl Through action as (Basic) rather than (Double).","SOURCE":"Van Saar Pack"},{"NAME":"Sump Slump","RESTRICTION":"Anyone","CONDITIONS":"Play at the start of any turn.","EFFECT":"Immediately remove D3 Barricades of your choice from anywhere on the board.","SOURCE":"Van Saar Pack"},{"NAME":"Bait And Switch","RESTRICTION":"Anyone","CONDITIONS":"Play this card instead of activating a fighter.","EFFECT":"Take a Ready marker from any of your fighters and place it on a fighter who has already activated this round.","SOURCE":"WHC Tactics PDF"},{"NAME":"Call The Faithful","RESTRICTION":"Cawdor","CONDITIONS":"Play this card after both sides have deployed.","EFFECT":"You may add an extra D3 fighters to your crew (potentially exceeding the normal crew size for the scenario). These fighters must be chosen randomly from any fighters not already included in your crew.","SOURCE":"WHC Tactics PDF"},{"NAME":"Lucky Shot","RESTRICTION":"Anyone","CONDITIONS":"Play this card after making either a hit roll, a wound roll or an injury roll.","EFFECT":"You may immediately re-roll all of the dice for the roll you have just made. You must accept the result of the second roll, even if it is worse .than the first.","SOURCE":"WHC Tactics PDF"},{"NAME":"Mass Infiltration","RESTRICTION":"Delaque","CONDITIONS":"Play this card during deployment. Choose D3 fighters in your crew.","EFFECT":"For the duration of this battle, these fighters gain the Infiltrate skill.","SOURCE":"WHC Tactics PDF"},{"NAME":"Stand Firm","RESTRICTION":"Anyone","CONDITIONS":"Play this card instead of making a Bottle test.","EFFECT":"This round, your gang automatically passes its Bottle test.","SOURCE":"WHC Tactics PDF"},{"NAME":"Stimm Overload","RESTRICTION":"Goliath","CONDITIONS":"Play this card instead of activating a fighter.","EFFECT":"This fighter counts a Charge (Double) action as a Basic action this turn.","SOURCE":"WHC Tactics PDF"},{"NAME":"Dark Blessings","RESTRICTION":"Chaos Helots","CONDITIONS":"Play this card when your Demagogue is Seriously Injured or taken Out of Action but before removing the fighter from the board.","EFFECT":"Make a Willpower check for the Demagogue. If the check is passed, replace the Demagogue with a Chaos Spawn. During the Wrap-up step, the Chaos Spawn is removed from play and you must test to see if the Demagogue succumbs their injuries, as if they were Seriously Injured when the battle ended.","SOURCE":"WHC Tactics PDF"},{"NAME":"Last Gasp","RESTRICTION":"Orlock","CONDITIONS":"Play this card when activating a Seriously Injured fighter.","EFFECT":"This fighter immediately becomes Standing and Active. At the end of this fighter’s activation, they go Out of Action and are removed from play.","SOURCE":"WHC Tactics PDF"},{"NAME":"Rapid Fire","RESTRICTION":"Anyone","CONDITIONS":"Play this card when activating a fighter.","EFFECT":"This turn, the fighter may make two Fire (Basic) actions, provide they use the same weapon for both and make no other actions for any reason. However, at the end of their activation, the weapon counts as automatically having failed an Ammo check.","SOURCE":"WHC Tactics PDF"},{"NAME":"Rapid Healing","RESTRICTION":"Anyone","CONDITIONS":"Play this card instead of activating a fighter.","EFFECT":"Choose one of your fighters. This fighter either recovers one Wound or removes one Flesh Wound.","SOURCE":"WHC Tactics PDF"},{"NAME":"Take The Initiative","RESTRICTION":"Anyone","CONDITIONS":"Play this card at the start of the round before rolling for Priority.","EFFECT":"Your gang has Priority this round. If multiple gangs play this card then they must roll off to see who has Priority as normal.","SOURCE":"WHC Tactics PDF"},{"NAME":"Blood Money","RESTRICTION":"Venators","CONDITIONS":"Play this card when an enemy Champion or Leader is taken Out of Action.","EFFECT":"Your gang immediately adds a number of credits equal to half the Champion’s or Leader’s cost (rounding up) to its stash.","SOURCE":"WHC Tactics PDF"},{"NAME":"Cult Ambush","RESTRICTION":"Genestealer Cult","CONDITIONS":"Play this card immediately before deployment.","EFFECT":"Your gang’s deployment area is expanded by 3\" (in all directions), though cannot overlap your enemy’s deployment area.","SOURCE":"WHC Tactics PDF"},{"NAME":"Double Time","RESTRICTION":"Anyone","CONDITIONS":"Play this card when activating a fighter.","EFFECT":"This fighter can perform a free Move (Simple) action during its activation. This free action is in addition to its two normal actions.","SOURCE":"WHC Tactics PDF"},{"NAME":"Reckless Charge","RESTRICTION":"Anyone","CONDITIONS":"Play this card when a fighter makes a Charge (Double) action.","EFFECT":"The fighter counts as having rolled a 3 on the D3 to determine their maximum charge range.","SOURCE":"WHC Tactics PDF"},{"NAME":"Speedy Recovery","RESTRICTION":"Anyone","CONDITIONS":"Play this card when making a Recovery test.","EFFECT":"One of your fighters can re-roll a single Recovery dice.","SOURCE":"WHC Tactics PDF"},{"NAME":"Swift Redeployment","RESTRICTION":"Escher","CONDITIONS":"Play this card instead of activating a fighter.","EFFECT":"Roll a D3. All of your fighters can immediately move that many inches, even if they have already been activated this round.","SOURCE":"WHC Tactics PDF"},{"NAME":"A Present for You!","RESTRICTION":"Anyone","CONDITIONS":"Play this card when your opponent activates one of their fighters, even if the fighter was activated as part of a Group Activation.","EFFECT":"Center the 3\" blast marker on the fighter who has just activated, then roll the Scatter Dice and a D6 to see where the marker moves to. If a Hit is rolled on the Scatter dice, the marker remains where it is. Roll a D6 on the table below to determine what kind of Trait(s) the blast has: 1-2 Concussion, 3-4 Flash, 5-6 Fear, Gas. Any fighters under the marker immediately suffer a hit with the Trait(s) listed.","SOURCE":"White Dwarf Dec 2019"},{"NAME":"Ambush Alley","RESTRICTION":"Anyone","CONDITIONS":"Play this gang tactic when an enemy fighter performs the Operate Door (Simple), Access Terminal (Basic), or Force Door (Basic) action.","EFFECT":"After the enemy fighter completes the action, choose a friendly fighter with line of sight to that enemy fighter. The friendly fighter may immediately perform a free Shoot (Basic) action. If the enemy fighter is still Standing and Active, they may perform a second action (if they have not done so already).","SOURCE":"Zone Mortalis Pack"},{"NAME":"Cometh the Harvest Lord!","RESTRICTION":"Corpse Grinders","CONDITIONS":"Play this gang tactic when a friendly fighter activates within 1\" of a closed Door.","EFFECT":"The fighter may perform a free Fight (Basic) action against one enemy fighter within 1\" of the other side of the Door.","SOURCE":"Zone Mortalis Pack"},{"NAME":"Hidden Vent","RESTRICTION":"Anyone","CONDITIONS":"Play this gang tactic when a friendly fighter performs a Move (Simple) action.","EFFECT":"During their movement, this fighter may pass through Impassable terrain, provided they end their movement with no part of their base within the Impassable terrain.","SOURCE":"Zone Mortalis Pack"},{"NAME":"Hunter in the Dark","RESTRICTION":"Venators","CONDITIONS":"Play this gang tactic during the Priority phase of any round, after Roll for Priority, but before Ready Fighters.","EFFECT":"Choose a 12\"x12\" section of the battlefield. Fighters within that section of the battlefield immediately gain the Hidden condition, as if affected by the Pitch Black rules (see the Necromunda Rulebook). Any fighter moving into this section of the battlefield also gains the hidden condition. The Hidden condition can be lost if the fighter moves outside this section of the battlefield. Any fighter who loses the Hidden condition cannot gain it again this round. During the End phase of this round, all fighters discard any Hidden condition markers caused by this tactic's effects and the tactic is discarded.","SOURCE":"Zone Mortalis Pack"},{"NAME":"Klaxon","RESTRICTION":"Enforcers","CONDITIONS":"Play this gang tactic during the Priority phase of any round, after Roll for Priority, but before Ready Fighters.","EFFECT":"For the duration of this round, enemy fighters may not make, or be part of, Group Activations unless they can draw a line of sight to a model in their crew with the Gang Leader special rule.","SOURCE":"Zone Mortalis Pack"},{"NAME":"Rat Warren","RESTRICTION":"Anyone","CONDITIONS":"Play this gang tactic after your opponent activates one of their fighters.","EFFECT":"If the fighter they have just activated does not have line of sight to any friendly fighters, they must make an Intelligence check. If this check is failed, you may place that fighter anywhere within 6\" of their current location. You may not place that fighter within 3\" of any of your fighters.","SOURCE":"Zone Mortalis Pack"},{"NAME":"Rise Up, Brothers & Sisters!","RESTRICTION":"Helot Cults","CONDITIONS":"Play this gang tactic at the start of any Action Phase.","EFFECT":"Until the End phase of this round, all fighters in your cre gain the Spring Up skill.","SOURCE":"Zone Mortalis Pack"},{"NAME":"Trip Wire","RESTRICTION":"Anyone","CONDITIONS":"Play this gang tactic when an enemy fighter ascends or descends a ladder or Stairs.","EFFECT":"Once the enemy fighter completes their Move action, they become pinned.","SOURCE":"Zone Mortalis Pack"},{"NAME":"Underhive Gloom","RESTRICTION":"Anyone","CONDITIONS":"Play this gang tactic at the start of the battle, after both crews have been deployed.","EFFECT":"For the duration of this battle, the hit rolls for ranged attacks made through open doorways or against fighters on a different level to the attacker suffer an additional -2 modifier to the hit roll.","SOURCE":"Zone Mortalis Pack"},{"NAME":"Unwashed Horde","RESTRICTION":"Cawdor","CONDITIONS":"Play this gang tactic at the start of the first round of the battle, before priority is rolled.","EFFECT":"Your gang may immediately deploy d3 Cawdor (Juve) fighters. These fighters are recruited for free but will leave the gang at the end of this battle. Each fighter is equipped with a reclaimed autopistol and a fighting knife. These fighters must be placed within 1\" of a Vent and at least 1\" from any other fighter. If you do not have models available to represent these fighters, you may discard this gang tactic and select another.","SOURCE":"Zone Mortalis Pack"},{"NAME":"Wall Breach","RESTRICTION":"Anyone","CONDITIONS":"Play this gang tactic when a friendly fighter makes a ranged attack.","EFFECT":"This fighter can choose targets that are out of their line of sight, provided they are not using a weapon with the Template or Blast (X\") traits. Attacks against these targets suffer a -2 modifier to their hit roll.","SOURCE":"Zone Mortalis Pack"},{"NAME":"Call the Beast","RESTRICTION":"Anyone","CONDITIONS":"Play this gang tactic when a friendly fighter performs a Move (Simple) action.","EFFECT":"After the enemy fighter completes their movement, nominate a Vent anywhere on the battlefield. For the remainder of this battle, this Vent counts as a Beast's Lair as described in the Necromunda Rulebook.","SOURCE":"Zone Mortalis Pack"},{"NAME":"From Below","RESTRICTION":"Anyone","CONDITIONS":"Play this gang tactic after rolling for Reinforcements but before placing reinforcement fighters on the Battlefield.","EFFECT":"Friendly fighters arriving via the Reinforcement rules can be deployed in the same manner as fighters with the Infiltrate skill, as long as they are deployed within 2\" of a Pipe of Vent.","SOURCE":"Zone Mortalis Pack"},{"NAME":"Hidden Swarm","RESTRICTION":"Genestealer Cults","CONDITIONS":"Play this tactic during the End phase of any round, before deploying any Reinforcements.","EFFECT":"Your gang may immediately deploy up to d3 Reinforcements from those fighters in your Reinforcement deck within 3\" of a friendly leader or Champion. These fighters must be placed within 1\" of a Vent and al least 1\" from any enemy fighter. No additional Reinforcements can arrive this round. If a fighter cannot be placed in this manner, the fighter is deployed as normal instead.","SOURCE":"Zone Mortalis Pack"},{"NAME":"Improvised Cover","RESTRICTION":"Anyone","CONDITIONS":"Play this gang tactic instead of activating a fighter.","EFFECT":"You may immediately place a barricade anywhere within 2\" of one of your fighters.","SOURCE":"Zone Mortalis Pack"},{"NAME":"Lockdown","RESTRICTION":"Anyone","CONDITIONS":"Play this gang tactic at the start of any Action Phase.","EFFECT":"All doors on the battlefield close if they are open, and then become locked, as detailed in the Necromunda rulebook.","SOURCE":"Zone Mortalis Pack"},{"NAME":"Long Shadows","RESTRICTION":"Delaque","CONDITIONS":"Play this gang tactic during the Priority phase of any round, after Roll for Priority, but before Ready Fighters.","EFFECT":"For the duration of this round, enemy fighters must make an Intelligence check if they wish to perform a ranged attack targeting any of your fighters that are both at Long Range and in cover.","SOURCE":"Zone Mortalis Pack"},{"NAME":"Lucky Ricochet","RESTRICTION":"Anyone","CONDITIONS":"Play this gang tactic when a friendly fighter hits with a ranged attack, and their target was within 2\" of a piece of Impassable terrain.","EFFECT":"After working out the effects of the hit, and if the fighter has not been removed from play, roll a d6 to see if that hit fighter is hit by a Stray Shot from the same weapon.","SOURCE":"Zone Mortalis Pack"},{"NAME":"Sparky...Smash!","RESTRICTION":"Slave Ogryns","CONDITIONS":"Play this gang tactic when a friendly fighter activates within 1\" of a closed Door.","EFFECT":"Remove the Door from teh battlefield. Any fighter, friend or foe, that was within 2\" of the other side of the Door must pass an Initiative check or become Prone and Pinned. This fighter's activation then ends.","SOURCE":"Zone Mortalis Pack"},{"NAME":"Wall Walking","RESTRICTION":"Escher","CONDITIONS":"Play this gang tactic at the start of any Action Phase.","EFFECT":"Until the End phase of this round, all fighters in your gang gain the Clamber skill.","SOURCE":"Zone Mortalis Pack"},{"NAME":"Emergency Replusors","RESTRICTION":"Anyone","CONDITIONS":"Play this gang tactic when a friendly fighter falls or jumps down from a ledge, but before working out the effects of the fall or jump.","EFFECT":"Place a 5\" Blast marker anywhere on the battlefield and leave it in place for the remainder of this round. Fighters falling or jumping onto this marker take no damage and are not Pinned.","SOURCE":"Zone Mortalis Pack"},{"NAME":"Fighting Retreat","RESTRICTION":"Orlock","CONDITIONS":"Play this gang tactic when your gang fails a Bottle test.","EFFECT":"For the remainder of this battle, all fighters in your gang may treat the Operate Door (Simple) action as a free action once during their activation.","SOURCE":"Zone Mortalis Pack"},{"NAME":"Knock! Knock!","RESTRICTION":"Goliath","CONDITIONS":"Play this gang tactic instead of activating a fighter.","EFFECT":"Choose a door within 2\" of a friendly fighter. Remove that door from the battlefield.","SOURCE":"Zone Mortalis Pack"},{"NAME":"Stairs Trap","RESTRICTION":"Van Saar","CONDITIONS":"Play this gang tactic instead of activating a fighter.","EFFECT":"Choose a set of Stairs anywhere on the battlefield. All fighters on teh chosen Stairs immediately fall (place them within 2\" of the foot of the Stairs in an order chosen by the palyer whose gang tactic this is). The fighters are then Pinned and suffer damage from falling as normal.","SOURCE":"Zone Mortalis Pack"},{"NAME":"Ead as Thick as Their Rig","RESTRICTION":"Goliath","CONDITIONS":"Play this gang tactic when a friendly vehicle is Wrecked, before rolling on the Lasting Injury table for the Crew.","EFFECT":"Do not roll on the table; the result is automatically Out Cold.","SOURCE":"Goliath Vehicles Pack"},{"NAME":"Batter Up
