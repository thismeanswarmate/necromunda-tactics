<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Necromunda Tactics Cards</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; font-size: 13px; color: #1a1a1a; background: #fff; padding: 16px; }
.toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; border-bottom: 1px solid #ddd; padding-bottom: 12px; flex-wrap: wrap; }
.tabs { display: flex; }
.tab { padding: 8px 16px; font-size: 13px; font-weight: 500; color: #666; cursor: pointer; border-bottom: 2px solid transparent; background: none; border: none; border-bottom: 2px solid transparent; }
.tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.filters { margin-bottom: 14px; padding: 10px 14px; background: #f8f8f8; border: 1px solid #e5e5e5; border-radius: 6px; }
.filters-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.filters-title { font-size: 11px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.06em; }
.btn-sm { padding: 3px 9px; font-size: 11px; background: #fff; color: #444; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; }
.btn-sm:hover { background: #f0f0f0; }
.filters-grid { display: flex; flex-wrap: wrap; gap: 5px 18px; }
.filter-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #333; cursor: pointer; white-space: nowrap; user-select: none; }
.filter-item input { width: 13px; height: 13px; cursor: pointer; accent-color: #0C447C; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th { font-size: 11px; font-weight: 500; color: #666; text-align: left; padding: 4px 8px 6px; border-bottom: 1px solid #e5e5e5; white-space: nowrap; }
tbody td { padding: 5px 8px; border-bottom: 1px solid #f0f0f0; vertical-align: top; line-height: 1.4; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: #e8f0fe; cursor: pointer; }
tbody tr.selected-row td { background: #EBF4FD; }
.restrict { font-size: 10px; color: #555; }
.src { font-size: 10px; color: #888; }
.empty { padding: 48px; text-align: center; color: #888; font-size: 13px; }
input[type=checkbox] { width: 14px; height: 14px; cursor: pointer; accent-color: #0C447C; }
.btn-pdf { padding: 7px 14px; background: #0C447C; color: #fff; border: none; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn-pdf:hover { background: #0a3a6b; }
.btn-pdf:disabled { background: #aaa; cursor: default; }
.count-badge { font-size: 12px; color: #666; }
.decks { margin-bottom: 14px; padding: 10px 14px; background: #f8f8f8; border: 1px solid #e5e5e5; border-radius: 6px; }
.decks-title { font-size: 11px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.deck-save-row { display: flex; gap: 6px; margin-bottom: 8px; }
.deck-save-row input { flex: 1; padding: 4px 8px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
.deck-save-row input:focus { border-color: #0C447C; }
.deck-list { display: flex; flex-direction: column; gap: 4px; }
.deck-item { display: flex; align-items: center; gap: 6px; padding: 5px 8px; background: #fff; border: 1px solid #e0e0e0; border-radius: 4px; }
.deck-item-name { flex: 1; font-size: 12px; font-weight: 500; color: #222; }
.deck-item-count { font-size: 11px; color: #888; margin-right: 4px; }
.deck-empty { font-size: 12px; color: #aaa; font-style: italic; }
.search-bar { margin-bottom: 14px; }
.search-bar input { width: 100%; padding: 7px 12px; font-size: 13px; border: 1px solid #ccc; border-radius: 6px; outline: none; }
.search-bar { position: relative; }
.search-bar input { padding-left: 30px; }
.search-bar input:focus { border-color: #0C447C; }
.search-clear { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 14px; color: #aaa; line-height: 1; padding: 0; display: none; }
.search-clear:hover { color: #555; }
mark { background: #fff176; color: inherit; border-radius: 2px; padding: 0 1px; }
</style>
</head>
<body>

<div class="toolbar">
  <div class="tabs">
    <button class="tab active" onclick="showTab('all',this)">All cards</button>
    <button class="tab" id="selected-tab" onclick="showTab('selected',this)">Selected (0)</button>
  </div>
  <span class="count-badge" id="count-badge">0 cards selected</span>
  <button class="btn-pdf" id="pdf-btn" onclick="exportPDF()" disabled>Print Cards</button>
</div>

<div class="filters">
  <div class="filters-header">
    <span class="filters-title">Show restrictions</span>
    <button class="btn-sm" onclick="setAllFilters(true)">All</button>
    <button class="btn-sm" onclick="setAllFilters(false)">None</button>
  </div>
  <div class="filters-grid" id="filters-grid"></div>
</div>

<div class="decks">
  <div class="decks-title">Saved Decks</div>
  <div class="deck-save-row">
    <input type="text" id="deck-name-input" placeholder="Deck name..." onkeydown="if(event.key==='Enter')saveDeck()" oninput="localStorage.setItem('nm_deckname',this.value)">
    <button class="btn-sm" onclick="saveDeck()">Save current selection</button>
  </div>
  <div class="deck-list" id="deck-list"></div>
</div>

<div class="search-bar">
  <button class="search-clear" id="search-clear" onclick="clearSearch()" title="Clear search">×</button>
  <input type="text" id="search-input" placeholder="Search cards by name, conditions, effect or restriction..." oninput="applySearch()">
</div>

<div id="tab-all" class="tab-content active">
  <table>
    <thead><tr>
      <th style="width:3%"></th>
      <th style="width:16%">Name</th>
      <th style="width:12%">Restriction</th>
      <th style="width:20%">Conditions</th>
      <th style="width:33%">Effect</th>
      <th style="width:16%">Source</th>
    </tr></thead>
    <tbody id="all-body"></tbody>
  </table>
  <div id="all-empty" class="empty" style="display:none">No cards match the current filters.</div>
</div>

<div id="tab-selected" class="tab-content">
  <div id="selected-empty" class="empty">No cards selected yet. Check the boxes on the All cards tab.</div>
  <table id="selected-table" style="display:none">
    <thead><tr>
      <th style="width:3%"></th>
      <th style="width:16%">Name</th>
      <th style="width:12%">Restriction</th>
      <th style="width:20%">Conditions</th>
      <th style="width:33%">Effect</th>
      <th style="width:16%">Source</th>
    </tr></thead>
    <tbody id="selected-body"></tbody>
  </table>
</div>

<script>
let cards = [];
const selected = new Set();
let activeFilters = new Set();

const CARDS_DATA = [{"NAME":"Ambush Masters","RESTRICTION":"Ash Waste Nomads","CONDITIONS":"Play this gang tactic at the start of the battle, after both sides have deployed, but before the first round.","EFFECT":"Your gang may immediately recruit and palce in your deployment zone d3 Ash Waste Nomads Dust Runners. These fighters are recruited for free but will leave your gang at the end of the battle. Each Dust Runner has up to 20 credits worh of equipment. If you do not ahve the models available to represent these fighters, you may discard this gang tactic and select another.","SOURCE":"Ash Waste Nomads Pack"},{"NAME":"Bait and Switch","RESTRICTION":"Ash Waste Nomads","CONDITIONS":"Play this gang tactic at the beginning of any round, before rolling for initiative.","EFFECT":"Select two friendly fighters on the battlefield, neither of which is Engaged. Swap the position of the two fighters.","SOURCE":"Ash Waste Nomads Pack"},{"NAME":"Blessed by the Storm","RESTRICTION":"Ash Waste Nomads","CONDITIONS":"Play this gang tactic at the start of the battle, after both sides have deployed, but before the first round.","EFFECT":"For the duration of this round, if the Visibility (X\") rule is not active for this battle, apply the Visibility (24\") rule. Otherwise, either increase or decrease the value of X\" by 6\" to a minimum of 6\".","SOURCE":"Ash Waste Nomads Pack"},{"NAME":"Now You See Me...","RESTRICTION":"Ash Waste Nomads","CONDITIONS":"Play this gang tactic at the start of a friendly fighter's activation.","EFFECT":"Remove the fighter from the battlefield and set it up again within 9\" of its initial position and more than 1\" away from any enemy model.","SOURCE":"Ash Waste Nomads Pack"},{"NAME":"Numbers Without End","RESTRICTION":"Ash Waste Nomads","CONDITIONS":"Play this gang tactic during any End phase, before your opponent maes any Recovery tests.","EFFECT":"You may return to play d3 friendly Gangers/Juves that have been taken Out of Action but did not suffer a Memorable Death result on the Lasting Injury table by placing them in your gang's deployment zone. These fighters retain any injuries suffered for going Out of Action but discard any Flesh Wounds.","SOURCE":"Ash Waste Nomads Pack"},{"NAME":"Ash Quake","RESTRICTION":"Ash Waste Nomads","CONDITIONS":"Play this gang tactic at the start of any round before rolling for initiative.","EFFECT":"All fighters on the Battlefield Surface must pass an Initiative test or become Prone and Pinned Any Ash Waste Nomads fighter gets +2 to this test.","SOURCE":"Ash Waste Nomads Pack"},{"NAME":"Fade to Ash","RESTRICTION":"Ash Waste Nomads","CONDITIONS":"Play this gang tactic during any End phase, before your opponent maes any Recovery tests.","EFFECT":"The battle ends as if youir gang had retreated from the battlefield. Friendly fighters who are Seriously Injured automatically recover and there is no chance for any fighters to be Captured.","SOURCE":"Ash Waste Nomads Pack"},{"NAME":"Ghosts in the Ash","RESTRICTION":"Ash Waste Nomads","CONDITIONS":"Play this gang tactic at the beginning of any round, before rolling for initiative.","EFFECT":"For the duration of this round, friendly Ash Waste Nomads fighters treat the Battlefield Surface as Open Terrain.","SOURCE":"Ash Waste Nomads Pack"},{"NAME":"Overcharge!","RESTRICTION":"Ash Waste Nomads","CONDITIONS":"Play this gang tactic when a friendly fighter makes a ranged attack, before rolling the dice.","EFFECT":"For the duration of the attack, the Shock trait activates on a Hit roll of 5+ instead of 6+.","SOURCE":"Ash Waste Nomads Pack"},{"NAME":"Raiders Without Equal","RESTRICTION":"Ash Waste Nomads","CONDITIONS":"Play this gang tactic during the Wrap-Up phase of the post-battle sequence.","EFFECT":"Add d3x10 credits to your gang's Stash for each enemy vehicle that was Wrecked during the battle.","SOURCE":"Ash Waste Nomads Pack"},{"NAME":"Secret Paths","RESTRICTION":"Ash Waste Nomads","CONDITIONS":"Play this gang tactic during any Rolling Roads phase of a Rolling Roads battle before checking to see if models rejoin the battle.","EFFECT":"For the duration of this round, friendlt fighters can attempt to rejoin the battle regardless of their Movement characteristic. If the scenario being played does not use the Rolling Roads rules you may discard this gang tactic and select another.","SOURCE":"Ash Waste Nomads Pack"},{"NAME":"Spineroach Venom","RESTRICTION":"Ash Waste Nomads","CONDITIONS":"Play this gang tactic when a friendly fighter makes a close combat attack before rolling dice.","EFFECT":"For the duration of this attack, one of the fighter's weapons with the Melee trait gains teh Toxin trait.","SOURCE":"Ash Waste Nomads Pack"},{"NAME":"Beseech the Great Spirits","RESTRICTION":"Ash Waste Nomads","CONDITIONS":"Play this gang tactic during any End phase, before making Recovery tests.","EFFECT":"You may re-roll any Recovery tests you make this round, but must keep the second result even if it is worse.","SOURCE":"Ash Waste Nomads Pack"},{"NAME":"Master Sniper","RESTRICTION":"Ash Waste Nomads","CONDITIONS":"Play this gang tactic when activating a friendly fighter.","EFFECT":"For the duration of this activation, increase the Long range of the fighter's weapon without either the Melee or Grenade trait by 6\".","SOURCE":"Ash Waste Nomads Pack"},{"NAME":"Mined!","RESTRICTION":"Ash Waste Nomads","CONDITIONS":"Play this gang tactic after an enemy vehicle has completed its activation.","EFFECT":"The enemy vehicle must immediately take a Loss of Control test.","SOURCE":"Ash Waste Nomads Pack"},{"NAME":"Survival Suits","RESTRICTION":"Ash Waste Nomads","CONDITIONS":"Play this gang tactic at the start of the battle, after both sides have deployed, but before the first round.","EFFECT":"For the duration of this battle, d3 friendly fighters fo your choice in your starting crew are immune to the effects of the Rad-phage trait.","SOURCE":"Ash Waste Nomads Pack"},{"NAME":"War of Attrition","RESTRICTION":"Ash Waste Nomads","CONDITIONS":"Play this gang tactic during the Wrap-up phase of the post-battle sequence.","EFFECT":"If your gang has fewer fighters taken Out of Action than the opposing gang, your gang gains d3 Reputation.","SOURCE":"Ash Waste Nomads Pack"},{"NAME":"Will-O'-The-Wastes","RESTRICTION":"Ash Waste Nomads","CONDITIONS":"Play this gang tactic at the start of the battle, after both sides have deployed, but before the first round.","EFFECT":"For the duration of this battle, d3 friendly fighters of your choice in your starting cres gain teh Dodge skill.","SOURCE":"Ash Waste Nomads Pack"},{"NAME":"Deadmen Walking","RESTRICTION":"Cawdor","CONDITIONS":"Play at the start of any End phase.","EFFECT":"If your gang is required to make a Bottle test during this End phase, it will automatically pass.","SOURCE":"Cawdor Pack"},{"NAME":"Duck and Cover","RESTRICTION":"Anyone","CONDITIONS":"Play this card when activating a fighter.","EFFECT":"This turn, the fighter may make two Shoot (Basic) actions, provided they use the same Basic or Pistol weapon for both. After resolving these actions, the fighter may move D3”.","SOURCE":"Cawdor Pack"},{"NAME":"Effigy of the Damned","RESTRICTION":"Cawdor","CONDITIONS":"Play at the start of any turn.","EFFECT":"Choose a terrain feature at least 6” in diameter or a board tile. For the duration of this turn, any models entering or beginning their turns in the affected area must roll to see if they catch fire, just as if they had been hit by a weapon with the Blaze trait.","SOURCE":"Cawdor Pack"},{"NAME":"Let It Burn!","RESTRICTION":"Cawdor","CONDITIONS":"Play at the start of any round.","EFFECT":"For the duration of this round, all ranged weapons used by friendly models gain the Blaze trait.","SOURCE":"Cawdor Pack"},{"NAME":"Death Trap","RESTRICTION":"Anyone","CONDITIONS":"Play this card when an enemy fighter makes an Operate Door action to either open or close a door. Note: Zone Mortalis only.","EFFECT":"The fighter must test to see if they are struck by the door as if they were standing in a doorway when the door is closed.","SOURCE":"Cawdor Pack"},{"NAME":"Faith Through Fear","RESTRICTION":"Cawdor","CONDITIONS":"Play this card when a fighter fails a Cool check.","EFFECT":"Instead of suffering the normal effects of failing a Cool check, the fighter immediately charges the nearest enemy model. If there are no enemy models in range, they become Pinned.","SOURCE":"Cawdor Pack"},{"NAME":"No Prisoners!","RESTRICTION":"Cawdor","CONDITIONS":"Play at the start of any End phase.","EFFECT":"For the duration of the End phase, Seriously Injured enemy models making Recovery tests must roll two Injury dice and pick the worst result.","SOURCE":"Cawdor Pack"},{"NAME":"Quick Time","RESTRICTION":"Anyone","CONDITIONS":"Play this card when activating a fighter.","EFFECT":"Tuck this card under the fighter’s card. While it is there, the fighter’s Move is increased by 2. In each End phase, roll a D6. On a 1, the card is discarded.","SOURCE":"Cawdor Pack"},{"NAME":"Righteous Day","RESTRICTION":"Cawdor","CONDITIONS":"Play at the start of any round.","EFFECT":"For the duration of the round, all successful wound rolls made against friendly fighter must be re-rolled. However, friendly fighters not engaged in melee must charge the nearest enemy model if possible, or use their entire activation to move as close to the enemy as possible.","SOURCE":"Cawdor Pack"},{"NAME":"Snap Fire","RESTRICTION":"Anyone","CONDITIONS":"Play this card after an enemy fighter completes an attack with a ranged weapon.","EFFECT":"A readied fighter in your gang may immediately take a shot at the enemy fighter with a Pistol or Basic weapon. However, they must subtract 1 from the hit roll.","SOURCE":"Cawdor Pack"},{"NAME":"You!","RESTRICTION":"Anyone","CONDITIONS":"Play this card when activating a fighter.","EFFECT":"Choose an enemy model with line of sight to the fighter you have just activated. For the remainder of the game, any ranged or melee attacks made by this fighter against the nominated enemy gain +1 on the wound roll. The fighter can only make ranged and melee attacks against the nominated enemy until that enemy has been taken Out of Action.","SOURCE":"Cawdor Pack"},{"NAME":"Blessed Visions","RESTRICTION":"Cawdor","CONDITIONS":"Play at the start of the game after both sides have deployed.","EFFECT":"For the duration of the game, the gang’s fighters may use their normal BS when making Blind Fire ranged attacks or ranged attack through Ductways.","SOURCE":"Cawdor Pack"},{"NAME":"Divine Motivation","RESTRICTION":"Cawdor","CONDITIONS":"Play at the start of the game after both sides have deployed.","EFFECT":"For the duration of the battle, the gang’s Leader adds 2 to the dice roll for any Cool checks they are required to take. If the leader is taken Out of Action, all friendly fighters must make an immediate Cool check or become Broken.","SOURCE":"Cawdor Pack"},{"NAME":"Faith Through Fire","RESTRICTION":"Cawdor","CONDITIONS":"Play at the start of any round.","EFFECT":"For the duration of this round, friendly models with a Blaze marker on them may move and take actions as normal - though they still take damage as normal. In addition, all their melee attacks gain the Blaze trait.","SOURCE":"Cawdor Pack"},{"NAME":"For the Lost!","RESTRICTION":"Cawdor","CONDITIONS":"Play at the start of any round.","EFFECT":"For every friendly model that has been taken Out of Action in the battle so far, one chosen Champion or Leader can add +1 to their Strength and Attacks characteristic, to a maximum of +3. These effects last until the end of the round.","SOURCE":"Cawdor Pack"},{"NAME":"Redemption","RESTRICTION":"Cawdor","CONDITIONS":"Play when a friendly fighter is taken Out of Action.","EFFECT":"Centre the 3” Blast marker on the fighter that has just been taken Out of Action. All models under the marker count as being hit by a frag grenade.","SOURCE":"Cawdor Pack"},{"NAME":"Stirring Oration","RESTRICTION":"Cawdor","CONDITIONS":"Play at the start of any round.","EFFECT":"Choose one friendly Leader or Champion model. For the duration of the round, the Leading by Example rule applies as long as the fighter can draw line of sight to the chosen model. For this round, the chosen Leader or Champion cannot benefit from the effects of cover.","SOURCE":"Cawdor Pack"},{"NAME":"Trapped Console","RESTRICTION":"Anyone","CONDITIONS":"Play this card when an enemy fighter interacts with a console, before the end of the action.","EFFECT":"Centre the 3” blast marker on the enemy fighter. All models under the marker suffer a Strength 3, AP -, Damage 1 hit.","SOURCE":"Cawdor Pack"},{"NAME":"Trap Chute","RESTRICTION":"Anyone","CONDITIONS":"Play when an enemy model crawls through a ductway.","EFFECT":"The enemy model is placed by the enemy player within 1” of a randomly chosen ductway with 18” of their current location. If there are no other ductway markers in this then the model is removed for D3 rounds. When they return to play, place them within 1” of the ductway they were crawling through.","SOURCE":"Cawdor Pack"},{"NAME":"Vacuum Chamber","RESTRICTION":"Anyone","CONDITIONS":"Place this card when a door is opened. Note: Zone Mortalis only.","EFFECT":"All models within 12” of the opening door are immediately moved D6” toward the doorway.","SOURCE":"Cawdor Pack"},{"NAME":"Blood Surge","RESTRICTION":"Anyone","CONDITIONS":"Play this card when activating a fighter.","EFFECT":"For the duration of the round, the fighter is treated as if they had used a stimm-slug stash. However, during the End phase, they do not need to check for a stimm overload.","SOURCE":"Corpse Grinder Pack"},{"NAME":"Blood-Drenched Champion","RESTRICTION":"Anyone","CONDITIONS":"Play this card instead of activating a fighter.","EFFECT":"An enemy fighter of your choice that is visible to your leader must pass a Nerve test, subtracting 2 from the result, or become Broken.","SOURCE":"Corpse Grinder Pack"},{"NAME":"Reign of Blood","RESTRICTION":"Corpse Grinders","CONDITIONS":"Play this card when a Leader or Champion in your gang takes an enemy fighter Out of Action with a weapon with the Melee trait.","EFFECT":"Tuck this card under the fighter's card. When this fighter makes a group activation, they may include one more fighter than normal as part of the group.","SOURCE":"Corpse Grinder Pack"},{"NAME":"Tainted Meat","RESTRICTION":"Anyone","CONDITIONS":"Play this card immediately after it has been drawn during step 7 of the pre-battle sequence.","EFFECT":"Nominate one fighter from your opponent's starting crew. That fighter starts this battle with one Flesh Wound.","SOURCE":"Corpse Grinder Pack"},{"NAME":"Unnerving Whispers","RESTRICTION":"Anyone","CONDITIONS":"Play this card instead of activating a fighter.","EFFECT":"An enemy fighter of your choice must pass a Willpower check at -2 or become subject to the Insanity condition. Place an Insanity marker on the fighter and immediately roll a D6 on the Insanity table.","SOURCE":"Corpse Grinder Pack"},{"NAME":"Veiled Threat","RESTRICTION":"Anyone","CONDITIONS":"Play this card during any Action phase, after Fleeing the Battlefield but before Activating Fighters.","EFFECT":"Choose a friendly fighter. For the remainder of the round, that fighter cannot be targeted by a ranged attack unless they are the only visible target.","SOURCE":"Corpse Grinder Pack"},{"NAME":"Bloodlust","RESTRICTION":"Anyone","CONDITIONS":"Play this card when a friendly fighter makes a Charge (Double) action.","EFFECT":"Choose a friendly visible fighter with a Ready marker within 8\" of the charging fighter. Once the charging fighter's Charge is fully resolved, the chosen fighter may immediately make a Charge (Double) action. Remove their Ready marker once this is Resolved.","SOURCE":"Corpse Grinder Pack"},{"NAME":"Fear of Betrayal","RESTRICTION":"Anyone","CONDITIONS":"Play this card instead of activating a fighter.","EFFECT":"An enemy fighter of your choice with a Ready marker must pass a Cool check or immediately make a Shoot (Basic) action against the closest visible fighter from their own gang, as if they were an enemy fighter. They then lose their Ready marker.","SOURCE":"Corpse Grinder Pack"},{"NAME":"Infamous Butcher","RESTRICTION":"Corpse Grinders","CONDITIONS":"Play this card at the start of the Deployment step of the pre-battle sequence, before any fighters have been deployed.","EFFECT":"For the duration of this battle, one Corpse Grinder fighter of your choice gains the Fearsome skill.","SOURCE":"Corpse Grinder Pack"},{"NAME":"Marked for Death","RESTRICTION":"Anyone","CONDITIONS":"Play this card instead of activating a fighter.","EFFECT":"Choose an enemy fighter. For the rest of the battle, add 1 to the result of any hit rolls for fighters from your gang when they target that fighter with a Melee weapon.","SOURCE":"Corpse Grinder Pack"},{"NAME":"Savage Brutality","RESTRICTION":"Corpse Grinders","CONDITIONS":"Play when an enemy fighter is Seriously Injured or taken Out of Action by a Melee attack.","EFFECT":"All enemy fighters within 12\" that can draw line of sight to the target must take Nerve tests. Any fighters not within 3\" become Broken as normal if they fail, but automatically rally in the End phase of the round.","SOURCE":"Corpse Grinder Pack"},{"NAME":"The Red Hunt","RESTRICTION":"Corpse Grinders","CONDITIONS":"Play this card during any Action phase, after Fleeing the Battlefield but before Activating Fighters.","EFFECT":"Each friendly fighter Engaged with an enemy fighter can take a Reaction attack; they do not need to make an Initiative check.","SOURCE":"Corpse Grinder Pack"},{"NAME":"Authority Breakdown","RESTRICTION":"Anyone","CONDITIONS":"Play this card during any Action phase, after Fleeing the Battlefield but before Activating Fighters.","EFFECT":"For the duration of this round, the range of Leading by Example for your opponent's Leader is decreased to 3\". If your opponent's Leader is not available for this battle, discard this card.","SOURCE":"Corpse Grinder Pack"},{"NAME":"Blade for Every Occasion","RESTRICTION":"Anyone","CONDITIONS":"Play this card when activating a fighter.","EFFECT":"Tuck this card under the fighter's card. Until the end of the battle, this fighter has an additional axe.","SOURCE":"Corpse Grinder Pack"},{"NAME":"Blood Fury","RESTRICTION":"Anyone","CONDITIONS":"Play when one of your fighters loses a Wound.","EFFECT":"Tuck this card under the fighter's card; for the rest of the battle, that fighter has the Berserker skill.","SOURCE":"Corpse Grinder Pack"},{"NAME":"Born to Slaughter","RESTRICTION":"Anyone","CONDITIONS":"Play this card immediately after it has been drawn during step 7 of the pre-battle sequence.","EFFECT":"Nominate one fighter from your starting crew. For the duration of this battle, that fighter gains +1 to their Weapon Skill and Cool but -1 to their Ballistic Skill and Willpower.","SOURCE":"Corpse Grinder Pack"},{"NAME":"Eager for Battle","RESTRICTION":"Anyone","CONDITIONS":"Play this card during the End phase, before drawing any cards to determine which fighter become available as Reinforcements.","EFFECT":"Add D3 to the number of Reinforcements you receive this turn. The enemy player deploys these extra Reinforcements on a 1-4, instead of the usual 1-2.","SOURCE":"Corpse Grinder Pack"},{"NAME":"Gripped By Fear","RESTRICTION":"Anyone","CONDITIONS":"Play at the start of any round, after rolling for Priority.","EFFECT":"Nominate D3 fighters on the enemy gang. For the duration of this round, they suffer -1 to their Weapon Skill and Cool characteristics.","SOURCE":"Corpse Grinder Pack"},{"NAME":"Keen Edge","RESTRICTION":"Anyone","CONDITIONS":"Play at the start of the game after both sides have deployed.","EFFECT":"Choose a Melee weapon possessed by a friendly fighter. For the duration of the game, increase its AP by 1. For example, a weapon with an AP of -1 will have an AP of -2.","SOURCE":"Corpse Grinder Pack"},{"NAME":"No Mercy For the Weak","RESTRICTION":"Anyone","CONDITIONS":"Play this card instead of activating a fighter.","EFFECT":"For the remainder of the round, add 1 to the result of any wound rolls for fighters from your gang when they target fighters with one or more Flesh Wounds.","SOURCE":"Corpse Grinder Pack"},{"NAME":"Blood Surge","RESTRICTION":"Corpse Grinders","CONDITIONS":"Play this card when a Standing and Active fighter in your gang is hit by a ranged attack.","EFFECT":"The fighter does not become Pinned. Instead, they may immediately make a Move (Simple) action. The fighter may perform this action even if they are not Ready.","SOURCE":"Dark Uprising Box"},{"NAME":"Excellent Reconnaissance","RESTRICTION":"Enforcers","CONDITIONS":"Play this card at the start of the Deployment step up of the Pre-battle sequence, before any fighters have been deployed.","EFFECT":"For the duration of this battle, one Palanite fighter (i.e., a fighter that is not a Subjugator) gains the Infiltrate skill.","SOURCE":"Dark Uprising Box"},{"NAME":"Visions of Slaughter","RESTRICTION":"Corpse Grinders","CONDITIONS":"Play this card at the start of any Action phase","EFFECT":"Until the End phase of this round, fighters from your gang treat the Charge action as (Basic) rather than (Double). However, until the End phase of this round, any fighter from your gang that performs the Charge (Basic) action reduces their Weapon Skill characteristic by -1.","SOURCE":"Dark Uprising Box"},{"NAME":"Ankle Holster","RESTRICTION":"Enforcers","CONDITIONS":"Play this card when activating a fighter","EFFECT":"Tuck this card under the fighter’s card. While it is there, the fighter may use their stubgun to make Shoot (Simple) actions as well as or in place of making Shoot (Basic) actions with any other ranged weapon. If the Ammoy symbol is rolled on the Firepower dice, the card is discarded.","SOURCE":"Dark Uprising Box"},{"NAME":"Appropriate Force","RESTRICTION":"Enforcers","CONDITIONS":"Play this card when activating a fighter","EFFECT":"If this fighter makes a Fight (Basic) action, they gain one additional attack. This attack must be made with a weapon with the Melee trait and cannot be made with a weapon with the Sidearm trait. Roll for this attack separately and, if it hits, resolved at +1 Damage.","SOURCE":"Dark Uprising Box"},{"NAME":"Bountiful Feast","RESTRICTION":"Corpse Grinders","CONDITIONS":"Play immediately after a fighter in your gang performs a Coup de Grace (Simple) action.","EFFECT":"Remove a number of Flesh Wounds from the fighter equal to the Wounds characteristic of the enemy fighter taken Out of Action by the Coup de Grace.","SOURCE":"Dark Uprising Box"},{"NAME":"Scent of Blood","RESTRICTION":"Corpse Grinders","CONDITIONS":"Play this card when a fighter in your gang is taken Out of Action","EFFECT":"Choose a friendly Standing and Engaged fighter within 9” and line of sight of the fighter taken Out of Action. They may immediately make a Fight (Basic) action, even if they are not Ready.","SOURCE":"Dark Uprising Box"},{"NAME":"Shock and Awe","RESTRICTION":"Enforcers","CONDITIONS":"Play at the start of any round.","EFFECT":"For the duration of this round, D3+1 fighters of the controlling player’s choice gain the Fearsome skill.","SOURCE":"Dark Uprising Box"},{"NAME":"Whirlwind of Blows","RESTRICTION":"Corpse Grinders","CONDITIONS":"Play this card when activating a fighter in your gang that is Standing and Engaged.","EFFECT":"For the duration of this fighter’s activation, increase their Attacks characteristic by 1 for each enemy fighter they are Engaged with.","SOURCE":"Dark Uprising Box"},{"NAME":"\"Don't Trip!\"","RESTRICTION":"Enforcers","CONDITIONS":"Play this card when an enemy fighter that has used a Move (simple) action to climb finishes the action.","EFFECT":"The enemy fighter must immediately pass an initiative check. If they fail, they will fall and are placed back where they started. If the enemy fighter climbed using a ladder or stairs, they gain a +2 modifier to the Initiative check.","SOURCE":"Dark Uprising Box"},{"NAME":"Blessed By Death","RESTRICTION":"Corpse Grinders","CONDITIONS":"Play this card when a fighter from your gang takes an enemy fighter Out of Action with a weapon with the Melee trait.","EFFECT":"Tuck this card under the fighter’s card; for the remainder of the battle, the fighter gains +1 WS.","SOURCE":"Dark Uprising Box"},{"NAME":"Extra Vest","RESTRICTION":"Enforcers","CONDITIONS":"Play this card immediately after a fighter fails a save roll.","EFFECT":"Roll a D6. On the roll of a 6, the save roll is passed. On any other result, the failed save roll stands.","SOURCE":"Dark Uprising Box"},{"NAME":"Frenzy","RESTRICTION":"Corpse Grinders","CONDITIONS":"Play this card instead of activating a fighter.","EFFECT":"Choose a single Ready enemy fighter within 9” and line of sight of one of your fighters. The chosen fighter must make a Cool check. If they fail, they lose their Ready marker and must immediately make a Move (Simple) action, moving as if subject to the Broken condition.","SOURCE":"Dark Uprising Box"},{"NAME":"Lockdown","RESTRICTION":"Enforcers","CONDITIONS":"Play at the start of any round.","EFFECT":"Every open door on the board that does not have a terminal closes. Every closed door on the board that does not have a door terminal becomes locked and can only be opened with force, either by targeting them with attacks or by performing a Force Door (Basic) action against them. Doors with terminals are unaffected by this card.","SOURCE":"Dark Uprising Box"},{"NAME":"Rend and Tear","RESTRICTION":"Corpse Grinders","CONDITIONS":"Play this card at the start of any Action phase.","EFFECT":"Until the End phase of this round, all weapons with the Melee trait used by friendly fighters gain the Rending trait.","SOURCE":"Dark Uprising Box"},{"NAME":"Stop and Search","RESTRICTION":"Enforcers","CONDITIONS":"Play immediately after a fighter on your gang performs a Coup De Grace (Simple) or Restrain (Simple) action.","EFFECT":"The Enforcer rifles through the pockets of their victim. Immediately add D6x10 credits to the gang’s Stash.","SOURCE":"Dark Uprising Box"},{"NAME":"Dancing Shadows","RESTRICTION":"Delaque","CONDITIONS":"Play this card when an enemy fighter makes a ranged attack.","EFFECT":"The attacking enemy fighter must pass an Intelligence check. If they fail, the attack automatically misses and their activation ends.","SOURCE":"Delaque Pack"},{"NAME":"Friend or Foe?","RESTRICTION":"Delaque","CONDITIONS":"Play at the start of any round, after rolling for Priority.","EFFECT":"Choose one of your fighters. For the duration of the round, fighters on the enemy gang may not target this fighter with any attacks. Additionally, this fighter may move within 1\" of enemy fighters, and vice versa. Should this fighter make any attacks targeting an enemy fighter, this card immediately expires.","SOURCE":"Delaque Pack"},{"NAME":"History of Violence","RESTRICTION":"Anyone","CONDITIONS":"Play during the pre-battle sequence, during Step Five: Choose Crews.","EFFECT":"That fighter is unwilling to face your gang in combat and so may not be selected for this battle. Your opponent must immediately discard that fighter and select another, following the same crew selection method as already used.","SOURCE":"Delaque Pack"},{"NAME":"Over Here…","RESTRICTION":"Delaque","CONDITIONS":"Play when an enemy model makes a Move (Simple) action.","EFFECT":"Instead of moving normally, the chosen enemy fighter moves D6\" in a direction chosen by you, stopping if they come into contact with any terrain.","SOURCE":"Delaque Pack"},{"NAME":"Service Tunnels","RESTRICTION":"Anyone","CONDITIONS":"Play when deploying your gang.","EFFECT":"One fighter chosen by you from your starting crew gains the Infiltrate skill for the duration of this battle and may be deployed accordingly.","SOURCE":"Delaque Pack"},{"NAME":"Spiked Drinks","RESTRICTION":"Anyone","CONDITIONS":"Play during the pre-battle sequence, during Step Five: Choose Crews.","EFFECT":"Nominate one fighter from your opponent's starting crew. For the duration of this battle, that fighter suffers -1 to their Ballistic Skill, Weapon Skill, and Intelligence, but gains +2 to their Cool.","SOURCE":"Delaque Pack"},{"NAME":"Vanish","RESTRICTION":"Delaque","CONDITIONS":"Play during any End phase, immediately after failing a Bottle test.","EFFECT":"Remove all friendly models from the board, even if they are Engaged in melee. The game then ends.","SOURCE":"Delaque Pack"},{"NAME":"Wrong Again","RESTRICTION":"Anyone","CONDITIONS":"Play when one of your fighters is hit by a ranged attack.","EFFECT":"Choose any other friendly fighter within range and line of sight of the attacking model. This chosen fighter becomes the new target for the attack, which is resolved as normal.","SOURCE":"Delaque Pack"},{"NAME":"Assassins","RESTRICTION":"Delaque","CONDITIONS":"Play instead of activating a fighter.","EFFECT":"For the remainder of this round, any ranged attacks made by a fighter that is outside of the target's vision arc gains +2 to hit.","SOURCE":"Delaque Pack"},{"NAME":"Darkness Descends","RESTRICTION":"Delaque","CONDITIONS":"Play at the start of any round other than the first, after rolling for Priority.","EFFECT":"At a pre-planned signal, the lights go out and the battlefield is plunged into darkness. For the remainder of the battle, the Pitch Black scenario rules are in effect. During each End phase, your opponent may roll a d6. On a 6, the Pitch Black rules are lifted and the lights come back on.","SOURCE":"Delaque Pack"},{"NAME":"Disorienting Shadows","RESTRICTION":"Anyone","CONDITIONS":"Play at the start of any round, after rolling for Priority.","EFFECT":"Nominate D3 fighters on the enemy gang. For the duration of this round, they suffer -1 to their Ballistic Skill and Movement characteristics.","SOURCE":"Delaque Pack"},{"NAME":"Eyes in the Dark","RESTRICTION":"Delaque","CONDITIONS":"Play at the start of any round other than the first, after rolling for Priority.","EFFECT":"For the duration of the round, all friendly fighters are treated as having photo goggles. Friendly fighters already equipped with photo goggles may instead ignore cover when making a Shoot (Basic) action targeting a Standing and Active enemy fighter. Note that this does not apply if the action would be (Simple) or (Double) for any reason.","SOURCE":"Delaque Pack"},{"NAME":"Faceless","RESTRICTION":"Delaque","CONDITIONS":"Play at the start of any round other than the first, after rolling for Priority.","EFFECT":"Choose two of your fighters anywhere on the board. These fighters swap positions, even if they are Engaged in melee. Leaders, Champions, Brutes, Hired Guns, and Seriously Injured fighters may not be moved using this card.","SOURCE":"Delaque Pack"},{"NAME":"Forward Planning","RESTRICTION":"Anyone","CONDITIONS":"Play at the start of the game, after both gangs have been deployed.","EFFECT":"Choose up to three fighters. These fighters may immediately make a free Move (Simple) action.","SOURCE":"Delaque Pack"},{"NAME":"Ghostly","RESTRICTION":"Delaque","CONDITIONS":"Play this card when activating a figure.","EFFECT":"Tuck this card under the fighter's card. While it is there, all ranged attacks targeting this fighter suffer an additional -1 modifier to the hit roll. In each End phase, roll a D6. On a 1, the card is discarded.","SOURCE":"Delaque Pack"},{"NAME":"Hidden Blade","RESTRICTION":"Anyone","CONDITIONS":"Play when a fighter makes a Fight (Basic) action.","EFFECT":"The fighter adds D3 to their Attacks characteristic for the duration of this action.","SOURCE":"Delaque Pack"},{"NAME":"Opening Volley","RESTRICTION":"Anyone","CONDITIONS":"Play at the start of the game, after both gangs have been deployed.","EFFECT":"Choose up to three fighters. These fighters may immediately make a free Shoot (Basic) action. Note that this does not apply if the action would be (Simple) or (Double) for any reason.","SOURCE":"Delaque Pack"},{"NAME":"Perfect Disguises","RESTRICTION":"Delaque","CONDITIONS":"Play during the pre-battle sequence, during Step Five: Choose Crews.","EFFECT":"If the scenario uses the Random Selection (X) method for choosing crews, you may add D3 to the number shown in brackets.","SOURCE":"Delaque Pack"},{"NAME":"Dirt on You","RESTRICTION":"Delaque","CONDITIONS":"Play at the start of the game, after both gangs have been deployed.","EFFECT":"Your gang has some information that is making the Leader of the enemy gang particularly twitchy. For the duration of the battle, your opponent's Leader suffers a - 1 modifier to any Cool checks they must make. If your opponent's leader is not available for this battle, discard this card.","SOURCE":"Delaque Pack"},{"NAME":"Labyrinth","RESTRICTION":"Delaque","CONDITIONS":"Play at the start of the game, after both gangs have been deployed.","EFFECT":"You may immediately move D6 obstacles up to 3\" in any direction. Alternatively, you may either add or remove D3 obstacles.","SOURCE":"Delaque Pack"},{"NAME":"Hard Stop","RESTRICTION":"Anyone","CONDITIONS":"Play when one of your fighters becomes Engaged as part of an enemy Charge (Double) action.","EFFECT":"Your fighter may immediately make a free Fight (Basic) action, interrupting the opposing fighter's activation.","SOURCE":"Enforcer Pack"},{"NAME":"Informant","RESTRICTION":"Enforcers","CONDITIONS":"Play this during the pre-battle sequence, during step 8: Deployment","EFFECT":"Nominate one fighter from your opponent's starting crew. You may remove this fighter and redeploy them as you wish, following the normal deployment rules for the scenario being played.","SOURCE":"Enforcer Pack"},{"NAME":"Preemptive Measures","RESTRICTION":"Anyone","CONDITIONS":"Play at the start of any round, before rolling for Priority.","EFFECT":"Up to two of your fighters may immediately make a free Move (simple) action.","SOURCE":"Enforcer Pack"},{"NAME":"Swift Justice","RESTRICTION":"Anyone","CONDITIONS":"Play this card when one of your fighters is taken Out of Action by an enemy fighter's attack.","EFFECT":"A friendly fighter can immediately make a free Shoot (Basic) action against the attacker.","SOURCE":"Enforcer Pack"},{"NAME":"Big Red Key","RESTRICTION":"Enforcers","CONDITIONS":"Play at the start of any round.","EFFECT":"For the duration of this round, any Force Door (Basic) actions taken by friendly fighters automatically succeed.","SOURCE":"Enforcer Pack"},{"NAME":"Breach and Clear","RESTRICTION":"Anyone","CONDITIONS":"Play after a friendly fighter makes an Operate Door (Simple) action or successful (force Door (Basic) action.","EFFECT":"The fighter may immediately make a free Shoot (Basic) action.","SOURCE":"Enforcer Pack"},{"NAME":"Dedicated to Duty","RESTRICTION":"Anyone","CONDITIONS":"Play during the End phase, before you make a Bottle test.","EFFECT":"Your gang automatically passes their Bottle test.","SOURCE":"Enforcer Pack"},{"NAME":"Long Arm","RESTRICTION":"Anyone","CONDITIONS":"Play at the start of any round.","EFFECT":"Until the End phase of this round, friendly fighters count as having +1 Strength for the purposes of determining the Long range of a grenade.","SOURCE":"Enforcer Pack"},{"NAME":"Loose Cannon","RESTRICTION":"Anyone","CONDITIONS":"Play when activating a fighter.","EFFECT":"Until the End phase of this round, the fighter treats the Shoot action as (Simple) rather than (Basic). However, until the End phase of this round, the fighter suffers a -1 to their Ballistic Skill.","SOURCE":"Enforcer Pack"},{"NAME":"Roger That!","RESTRICTION":"Anyone","CONDITIONS":"Play at the start of any round.","EFFECT":"Pick a Ganger with a Ready marker. For this turn only, that fighter is treated as a champion for the purposes of activating groups - in other words, if they are activated, you can activate up to one other fighter within 4\" of them.","SOURCE":"Enforcer Pack"},{"NAME":"Shield Wall","RESTRICTION":"Anyone","CONDITIONS":"Play this card instead of activating a fighter.","EFFECT":"Tuck this card under a fighter's card. For the remainder of the battle, add 1 to the fighter's armor save, and any friendly fighter in base contact with this fighter, to a maximum of 2+, against attacks that originate from within this fighter's vision arc.","SOURCE":"Enforcer Pack"},{"NAME":"Stop Resisting","RESTRICTION":"Anyone","CONDITIONS":"Play this card when a friendly Standing and Engaged fighter makes a Fight (Basic) action (including as part of a Charge (double) action).","EFFECT":"Until the End phase of this round, enemy fighters cannot make Reaction attacks against this fighter.","SOURCE":"Enforcer Pack"},{"NAME":"Close to Retirement","RESTRICTION":"Anyone","CONDITIONS":"Play at the start of any round.","EFFECT":"Until the End phase of this round, your opponent's leader suffers a -2 modifier to any Cool checks they must make. If your opponent's leader is not available for this battle, discard this card.","SOURCE":"Enforcer Pack"},{"NAME":"Crackdown","RESTRICTION":"Enforcers","CONDITIONS":"Play at the start of any round.","EFFECT":"Until the End phase of the round, all weapons with the Melee trait used by friendly fighters gain the Concussion trait.","SOURCE":"Enforcer Pack"},{"NAME":"Cut Their Supply","RESTRICTION":"Anyone","CONDITIONS":"Play at the start of the game after both sides have deployed.","EFFECT":"Choose a weapon possessed by an enemy fighter. For the duration of the game, this weapon loses the Plentiful trait if it has it, and gains the Scarce trait if it doesn't have it.","SOURCE":"Enforcer Pack"},{"NAME":"Got Your Back","RESTRICTION":"Anyone","CONDITIONS":"Play at the start of any round.","EFFECT":"Until the End phase of this round, fighters in your gang can provide assists even if they are Engaged with any other fighters from the same gang as the target of the attack. Only one fighter can provide an assist in this way for each close combat attack.","SOURCE":"Enforcer Pack"},{"NAME":"Jaded Veteran","RESTRICTION":"Enforcers","CONDITIONS":"Play this card at the start of the Deployment step of the pre-battle sequence, before any fighters have been deployed.","EFFECT":"For the duration of this battle, one fighter of your choice cannot be subject to the Broken condition.","SOURCE":"Enforcer Pack"},{"NAME":"Look the Other Way","RESTRICTION":"Anyone","CONDITIONS":"Play this card when a sentry spots an attacker.","EFFECT":"The sentry does not gain a Ready marker. In addition, you may change the sentry's facing as you wish.","SOURCE":"Enforcer Pack"},{"NAME":"Loud and Clear","RESTRICTION":"Anyone","CONDITIONS":"Play during the pre-battle sequence, during Step 8: Deployment.","EFFECT":"Tuck this card under a fighter's card. Until the end of the battle, this fighter has Stun Grenades.","SOURCE":"Enforcer Pack"},{"NAME":"Tactical Redeployment","RESTRICTION":"Anyone","CONDITIONS":"Play during the pre-battle sequence, during Step 5: Choose Crews.","EFFECT":"If the scenario uses Random (X) crew selection, you may re-select any fighters of your choice. Shuffle the cards back into your deck and redraw that number of cards. The second draw stands, even if the same fighters are drawn again.","SOURCE":"Enforcer Pack"},{"NAME":"Gifts of the Matron","RESTRICTION":"Escher","CONDITIONS":"Play this gang tactic when activating a fighter.","EFFECT":"The fighter can choose to apply a single Chem-alchemy Stimm effect to themselves.","SOURCE":"Escher (HoB) Pack"},{"NAME":"Hit and Run","RESTRICTION":"Escher","CONDITIONS":"Play this gang tactic at the start of the End phase.","EFFECT":"Choose three of your fighters. These fighters may make a free Move (Simple) action or a Retreat (Basic) action.","SOURCE":"Escher (HoB) Pack"},{"NAME":"Mistress of Death","RESTRICTION":"Escher","CONDITIONS":"Play this gang tactic when a friendly Death-maiden takes an enemy fighter Out of Action.","EFFECT":"The Death-maiden’s activation immediately ends, but she immediately becomes Standing and Active, and can be activated again this round.","SOURCE":"Escher (HoB) Pack"},{"NAME":"Queen of the Hive","RESTRICTION":"Escher","CONDITIONS":"Play this gang tactic at the start of the Action phase.","EFFECT":"For the duration of this round, enemy fighters must pass a Willpower check if they wish to target a fighter in your crew with the Leader (Escher) special rule with a Shoot or Fight (Basic) action. If this check is failed they may choose a different target, ignoring the fighter with the Leader (Escher) special rule for the purposes of the Target Priority rule. If your crew does not include a fighter with the Leader (Escher) special rule, you may discard this gang tactic and select another.","SOURCE":"Escher (HoB) Pack"},{"NAME":"Rain of Blades","RESTRICTION":"Escher","CONDITIONS":"Play this gang tactic when activating a fighter.","EFFECT":"The fighter can immediately make a Charge (Double) action. This charge is a free action and does not count against their normal allotment of actions this activation.","SOURCE":"Escher (HoB) Pack"},{"NAME":"Running Battle","RESTRICTION":"Escher","CONDITIONS":"Play this gang tactic when activating a fighter.","EFFECT":"The active fighter may make a Run and Gun (Double) action as if they had the Hip Shooting skill. If the fighter is part of a Group Activation then all fighters involved in the Group Activation may make a Run and Gun (Double) action.","SOURCE":"Escher (HoB) Pack"},{"NAME":"Shivver Prophesy","RESTRICTION":"Escher","CONDITIONS":"Play this gang tactic at the start of the End phase.","EFFECT":"The game then ends and victory conditions and rewards are worked out as normal.","SOURCE":"Escher (HoB) Pack"},{"NAME":"Sisterhood of Violence","RESTRICTION":"Escher","CONDITIONS":"Play this gang tactic when an enemy fighter is taken Out of Action as a result of an attack made by a friendly fighter.","EFFECT":"After completing the current fighter’s activation, immediately activate a friendly fighter within 12\" of the fighter who just activated.","SOURCE":"Escher (HoB) Pack"},{"NAME":"Unexpected Help","RESTRICTION":"Escher","CONDITIONS":"Play this gang tactic at the start of the End phase.","EFFECT":"Choose a fighter in your gang who was not included as part of your crew for this scenario. This fighter immediately arrives using the rules for Reinforcements.","SOURCE":"Escher (HoB) Pack"},{"NAME":"Wyld Hunt","RESTRICTION":"Escher","CONDITIONS":"Play this gang tactic at the start of the Deployment step of the pre-battle sequence, before any fighters have been deployed.","EFFECT":"Your gang may immediately recruit an Escher Wyld Runner and two Phelynx. These fighters are recruited for free but will leave the gang at the end of this battle. The Wyld Runner is armed with a whip and throwing knives. These fighters are not counted towards your maximum crew size – they are taken in addition to your starting crew. If you do not have models available to represent these fighters, you may discard this gang tactic and select another.","SOURCE":"Escher (HoB) Pack"},{"NAME":"Chemical Reign","RESTRICTION":"Escher","CONDITIONS":"Play this gang tactic when activating a fighter.","EFFECT":"The active fighter can choose to apply a single Chem-alchemy effect to one of their weapons that has either the Gas and/or Toxin traits.","SOURCE":"Escher (HoB) Pack"},{"NAME":"Dance of Death","RESTRICTION":"Escher","CONDITIONS":"Play this gang tactic at the start of the Action phase.","EFFECT":"For the duration of the round, all friendly Escher fighters gain the Acrobatic skill.","SOURCE":"Escher (HoB) Pack"},{"NAME":"Death and the Maiden","RESTRICTION":"Escher","CONDITIONS":"Play this gang tactic when a friendly fighter suffers a Memorable Death result on the Lasting Injury table.","EFFECT":"Roll 2D6. If the result is equal to or lower than the fighter’s Toughness characteristic, add a Deathmaiden to your gang. The new Death-maiden comes with no advancements or equipment.","SOURCE":"Escher (HoB) Pack"},{"NAME":"Free Fall","RESTRICTION":"Escher","CONDITIONS":"Play this gang tactic at the start of the battle, after both sides have deployed, but before the first round.","EFFECT":"For the duration of the game, fighters in your crew gain the Catfall skill.","SOURCE":"Escher (HoB) Pack"},{"NAME":"Predatory Phyrr","RESTRICTION":"Escher","CONDITIONS":"Play this gang tactic at the start of the Action phase.","EFFECT":"For the duration of the round, enemy fighters become subject to the Horrors in the Dark special","SOURCE":"Escher (HoB) Pack"},{"NAME":"Search and Scrag","RESTRICTION":"Escher","CONDITIONS":"Play this gang tactic when an enemy fighter fails a Nerve test.","EFFECT":"After the enemy fighter has completed their Run for Cover (Double) action, any of your fighters within 12\" of them may make a Move (Simple) action. They must end this free move closer to the Broken fighter.","SOURCE":"Escher (HoB) Pack"},{"NAME":"Blade Traps","RESTRICTION":"Escher","CONDITIONS":"Play this gang tactic instead of activating a fighter.","EFFECT":"Place a Blade Cage marker anywhere within 2\" of one of your fighters. When triggered, roll a D6. On a 4+, it is a Real Trap as detailed in the rules for Hidden Traps on page 100.","SOURCE":"Escher (HoB) Pack"},{"NAME":"Kill Count","RESTRICTION":"Escher","CONDITIONS":"Play this gang tactic at the start of the Action phase.","EFFECT":"Choose a number between 1 and 6. If this number of enemy fighters are Seriously Injured or taken Out of Action as a result of attacks made by your fighters this round (fighters fleeing the battle as a result of failing a Bottle test do not count) then, if your gang’s Leader is part of your crew for this battle, your gang’s Leader earns a number of XP equal to the number chosen. If your crew does not include a fighter with the Leader (Escher) special rule, you may discard this gang tactic and select another.","SOURCE":"Escher (HoB) Pack"},{"NAME":"Blazing Fury","RESTRICTION":"Anyone","CONDITIONS":"Play this card when activating a fighter.","EFFECT":"For the duration of this fighter's turn, the Shoot action is treated as Simple rather than Basic.","SOURCE":"Escher Pack"},{"NAME":"Crossfire","RESTRICTION":"Anyone","CONDITIONS":"Play this card when a fighter makes a ranged attack against a target who has already been shot at by a friendly fighter.","EFFECT":"The hit roll succeeds automatically.","SOURCE":"Escher Pack"},{"NAME":"Reaction Fire","RESTRICTION":"Anyone","CONDITIONS":"Play when an enemy fighters is activated, before they make their first action.","EFFECT":"Pick a fighter from your gang – that fighter can immediately make a Shoot (Basic) action against the activating enemy model, as long as they are in range and line of sight.","SOURCE":"Escher Pack"},{"NAME":"A New Strain","RESTRICTION":"Escher","CONDITIONS":"Play immediately before rolling to wound with a Gas weapon.","EFFECT":"Add 2 to the result of the dice roll to determine whether the target succumbs to the gas.","SOURCE":"Escher Pack"},{"NAME":"Blackout","RESTRICTION":"Anyone","CONDITIONS":"Play this card at the start of any round.","EFFECT":"For the duration of this round, ranged attacks have an additional -1 modifier if made against targets between 6’’ and 12’’ away, or a -2 modifier if made against targets more than 12’’ away. Attackers using an infra-scope or photo-goggles, or targeting a fighter with a Blaze marker, ignore these penalties.","SOURCE":"Escher Pack"},{"NAME":"Chain Attacks","RESTRICTION":"Anyone","CONDITIONS":"Play when a fighter takes an enemy Out of Action with a Melee attack.","EFFECT":"The activating fighter can move up to D6’’ and make a Fight Basic action. Their activation then immediately ends.","SOURCE":"Escher Pack"},{"NAME":"Proper Preparation","RESTRICTION":"Anyone","CONDITIONS":"Play this card before setting up the gang at the start of the battle.","EFFECT":"Pick one of your fighters and put this card under their Fighter's card. For the duration of the battle, this fighter's weapons gain the Plentiful trait unless they already have the Scarce trait, in which case their weapons are counted as not being Scarce.","SOURCE":"Escher Pack"},{"NAME":"Put Them Down!","RESTRICTION":"Escher","CONDITIONS":"Play at the end of any Action phase.","EFFECT":"Any Seriously Injured enemy fighters that are within 2’’ of an Active fighter from this gang are immediately taken Out of Action.","SOURCE":"Escher Pack"},{"NAME":"Siren Howls","RESTRICTION":"Escher","CONDITIONS":"Play at the start of any End phase.","EFFECT":"Until the start of the next End phase, add 1 to the result of any Bottle tests made for the enemy gang. In addition, Broken enemy fighters cannot rally.","SOURCE":"Escher Pack"},{"NAME":"Suppressing Fire","RESTRICTION":"Anyone","CONDITIONS":"Play this card after making an unsuccessful hit roll for a ranged weapon.","EFFECT":"The target is Pinned, even though they were not hit by the attacks.","SOURCE":"Escher Pack"},{"NAME":"Tunnel Runners","RESTRICTION":"Escher","CONDITIONS":"Play at the start of any round. Note: Zone Mortalis only.","EFFECT":"For the duration of the round, all friendly fighters can move through pitfalls and ductways as though they were clear terrain. They cannot end their turn on them.","SOURCE":"Escher Pack"},{"NAME":"Battle Madness","RESTRICTION":"Anyone","CONDITIONS":"Play instead of activating a fighter.","EFFECT":"Choose a Broken Fighter from either gang. They immediately make a ranged attack against the closest fighter they can see, friend or foe. If they are in base contact with another fighter, they make close combat attacks instead.","SOURCE":"Escher Pack"},{"NAME":"Burst of Courage","RESTRICTION":"Anyone","CONDITIONS":"Play this card when making a Cool check for a fighter.","EFFECT":"The fighter automatically passes the check, and any more Cool checks they are required to make until the end of the round.","SOURCE":"Escher Pack"},{"NAME":"Having a Bad Day","RESTRICTION":"Anyone","CONDITIONS":"Play at the start of the game after both sides have set up.","EFFECT":"Choose a Champion or Leader model in your opponent’s crew. For the duration of the game, Cool checks for other fighters from the opposing gang have a -2 modifier while that fighter is within 3’’ of the chosen Champion or Leader.","SOURCE":"Escher Pack"},{"NAME":"Not So Easy…","RESTRICTION":"Escher","CONDITIONS":"Play at the start of any round after the opposing gang has bottled out.","EFFECT":"When making Nerve tests for opposing fighters to see if they flee, subtract 2 from the result if they are within 3’’ of a fighter from this gang.","SOURCE":"Escher Pack"},{"NAME":"Side by Side","RESTRICTION":"Escher","CONDITIONS":"Play instead of activating a fighter.","EFFECT":"Until the end of this round, any assists that are granted by fighters from this gang grant a +2 bonus to the hit roll (instead of +1).","SOURCE":"Escher Pack"},{"NAME":"Three-Point Landing","RESTRICTION":"Escher","CONDITIONS":"Play when a fighter falls. Note: Sector Mechanicus only.","EFFECT":"The fighter is not Pinned by the fall and does not suffer a hit. If they still have any actions to take, they can take them.","SOURCE":"Escher Pack"},{"NAME":"Trusty Backup","RESTRICTION":"Anyone","CONDITIONS":"Play this card when activating a fighter.","EFFECT":"Put this card under the active fighter’s Fighter card. Until the end of the battle, this fighter has an additional stub gun.","SOURCE":"Escher Pack"},{"NAME":"Ultra-Violence","RESTRICTION":"Escher","CONDITIONS":"Play instead of activating a fighter.","EFFECT":"For the remainder of the round, all weapons with the Melee trait gain Parry – if they did not already have it – and increase their AP by -1.","SOURCE":"Escher Pack"},{"NAME":"Beast Lure","RESTRICTION":"Anyone","CONDITIONS":"A fighter can spend an action to play this card.","EFFECT":"Place the Beast’s Lair marker within 3’’ of this fighter. Then, they can move up to D6’’. If they end the action within 6’’ of the lair, there is a chance they will be attacked as normal.","SOURCE":"Escher Pack"},{"NAME":"Genetically Gifted","RESTRICTION":"Goliath","CONDITIONS":"Play this gang tactic at the start of the Deployment step of the pre-Battle sequence before any fighters have been deployed.","EFFECT":"Choose a House Goliath fighter in your starting crew. Until the end of this battle, that fighter gains one additional genetic upgrade of your choice. This must be from the same category as that fighter’s chosen subtype (Vatborn, Natborn, Unborn) but does not affect their credit cost.","SOURCE":"Goliath (HoC) Pack"},{"NAME":"Get 'Em!","RESTRICTION":"Goliath","CONDITIONS":"Play this gang tactic during the Priority phase of any round, after the Roll for Priority but before Ready Fighters","EFFECT":"Until the End phase of this round, all friendly House Goliath fighters activated as part of a Group Activation may add 2\" to their Movement characteristic during their Activation","SOURCE":"Goliath (HoC) Pack"},{"NAME":"Improvised Projectile","RESTRICTION":"Goliath","CONDITIONS":"Play this gang tactic when activating a friendly House Goliath fighter","EFFECT":"Choose one of the fighter’s weapons with the Melee trait. Until the end of this fighter’s activation, that weapon gains both a Long range characteristic of 4\" and the Versatile trait. However, until the End phase of this round, this fighter cannot make a Reaction attack with that weapon","SOURCE":"Goliath (HoC) Pack"},{"NAME":"Named and Shamed","RESTRICTION":"Goliath","CONDITIONS":"Play this gang tactic at the start of the Deployment step of the pre-Battle sequence before any fighters have been deployed.","EFFECT":"Your gang may immediately recruit up to two Goliath (Juves). These fighters are recruited for free but will leave the gang at the end of this battle. Each fighter is equipped with a maul and either a stimm-slug stash or a frenzon collar. These fighters are not counted towards your maximum crew size – they are taken in addition to your starting crew. If you do not have models available to represent these fighters, you may discard this gang tactic and select another.","SOURCE":"Goliath (HoC) Pack"},{"NAME":"One Last Go","RESTRICTION":"Goliath","CONDITIONS":"Play this gang tactic when one of your House Goliath fighters is taken Out of Action by an attack made with a ranged weapon.","EFFECT":"Before removing the fighter from the battlefield, they may immediately make a Charge (Double) action. After this action is resolved, the fighter goes Out of Action as normal.","SOURCE":"Goliath (HoC) Pack"},{"NAME":"They're Only Bullets!","RESTRICTION":"Goliath","CONDITIONS":"Play this gang tactic during the Priority phase of any round, after the Roll for Priority but before Ready Fighters","EFFECT":"Until the End phase of this round, all friendly House Goliath fighters that are within 6\" of, and have a line of sight to, a friendly House Goliath (Leader) or (Champion) gain the Nerves of Steel skill.","SOURCE":"Goliath (HoC) Pack"},{"NAME":"Apprentice","RESTRICTION":"Goliath","CONDITIONS":"Play this gang tactic at the start of the battle, after both sides have deployed but before the first round.","EFFECT":"Choose a friendly Goliath (Champion) and a friendly Goliath (Juve) or (Prospect). Until the end of this battle, the (Champion) gains the Overseer skill. However, this skill can only be used to activate the chosen (Juve) or (Prospect). If the chosen (Champion) already has the Overseer skill, the Order (Double) actions becomes an Order (Basic) action when used to activate the chosen (Juve) or (Prospect).","SOURCE":"Goliath (HoC) Pack"},{"NAME":"Boost Up","RESTRICTION":"Goliath","CONDITIONS":"Play this gang tactic when activating a friendly House Goliath fighter","EFFECT":"This fighter can perform a Boost (Double) action: Boost (Double): Choose a single Standing and Active friendly fighter that is within 2\" of this fighter. That fighter may immediately be moved up to 6\" vertically and 1\" horizontally","SOURCE":"Goliath (HoC) Pack"},{"NAME":"Fireborn","RESTRICTION":"Goliath","CONDITIONS":"Play this gang tactic at the start of the battle, after both sides have deployed but before the first round.","EFFECT":"Choose up to three House Goliath fighters in your starting crew. Until the end of this battle, the chosen fighters become immune to both the Blaze and the Rad-phage traits.","SOURCE":"Goliath (HoC) Pack"},{"NAME":"Hammer Blow","RESTRICTION":"Goliath","CONDITIONS":"Play this gang tactic during the Priority phase of any round, after the Roll for Priority but before Ready Fighters.","EFFECT":"Until the End phase of this round, all friendly House Goliath fighters’ weapons with the Melee trait gain the Knockback trait.","SOURCE":"Goliath (HoC) Pack"},{"NAME":"The Hand That Feeds You","RESTRICTION":"Goliath","CONDITIONS":"Play this gang tactic at the start of the Deployment step of the pre-Battle sequence before any fighters have been deployed","EFFECT":"The gang may recruit a House Agent for this battle without needing to make a Petition and without needing to pay a hiring fee (i.e., this House Agent is hired for free). If they do so, during the post-battle sequence the gang gains no credits from scenario rewards. If you do not have a model available to represent this House Agent, you may discard this gang tactic and select another.","SOURCE":"Goliath (HoC) Pack"},{"NAME":"Vat Twin","RESTRICTION":"Goliath","CONDITIONS":"Play this gang tactic at the start of the battle, after both sides have deployed but before the first round.","EFFECT":"Choose two House Goliath fighters in your starting crew to be Vat Twins. If, during the battle, one of these fighters is taken Out of Action, the other fighter removes any Flesh Wounds it has and gains the Berserker, Nerves of Steel and Unstoppable skills until the end of this battle. If both fighters are targeted by the same attack, fully resolve the attack against both before applying this gang tactic; both fighters may go Out of Action before this card takes effect.","SOURCE":"Goliath (HoC) Pack"},{"NAME":"Walking Fortress","RESTRICTION":"Goliath","CONDITIONS":"Play this gang tactic when activating any friendly fighter.","EFFECT":"Place a Furnace Barricade within 1\" of the fighter. The fighter’s activation then ends.","SOURCE":"Goliath (HoC) Pack"},{"NAME":"Crunch Time","RESTRICTION":"Goliath","CONDITIONS":"Play this gang tactic during the Priority phase of any round, after the Roll for Priority but before Ready Fighters","EFFECT":"Until the End phase of this round, all unarmed attacks made by friendly fighters gain +1 S and the Pulverise trait.","SOURCE":"Goliath (HoC) Pack"},{"NAME":"Stimm Reserve","RESTRICTION":"Goliath","CONDITIONS":"Play this gang tactic when activating any friendly fighter.","EFFECT":"Choose one friendly fighter that is currently on the battlefield. Until the end of this battle, that fighter’s Strength characteristic is increased by D3, However, until the end of this battle, that fighter’s Toughness characteristic is decreased by 1. Note that if this decrease in Toughness reduces that fighter’s Toughness to 0, they will go Out of Action as normal.","SOURCE":"Goliath (HoC) Pack"},{"NAME":"Subconscious Mnemonics","RESTRICTION":"Goliath","CONDITIONS":"Play this gang tactic at the start of the Deployment step of the pre-Battle sequence before any fighters have been deployed.","EFFECT":"Choose a friendly House Goliath (Leader) or (Champion) with two or more skills. For the remainder of this battle, that fighter may exchange one of their skills for another skill of the same skill set (i.e., a Muscle Skill may be exchanged with another Muscle Skill). The controlling player chooses which skill is replaced and which skill it is replaced with.","SOURCE":"Goliath (HoC) Pack"},{"NAME":"Tempered in Battle","RESTRICTION":"Goliath","CONDITIONS":"Play this gang tactic when a friendly House Goliath fighter takes an enemy fighter Out of action with a close combat attack or by performing Coup de Grace.","EFFECT":"Alternatively, until the end of this battle that (Champion) may gain the Mentor skill. However, this skill is card under the fighters card, they are not removed from play. If they were prone, they return to standing. They go out of action after they are next activated and take a turn or when they suffer another unsaved wound, whichever comes first.","SOURCE":"Goliath Pack"},{"NAME":"Ricochet","RESTRICTION":"Anyone","CONDITIONS":"Play this card after making an unsuccessful hit roll for a ranged attack that does not have the Blast or Template trait.","EFFECT":"Pick another fighter within 5’’ of the target, even if they are not visible to the attacker, and roll to hit against them. Do not roll the Firepower dice again.","SOURCE":"Goliath Pack"},{"NAME":"Deadlock","RESTRICTION":"Anyone","CONDITIONS":"Play this card at the start of any round. Note: Zone Mortalis only.","EFFECT":"Choose a closed door anywhere on the board. For the duration of this round, the door cannot be opened in any way.","SOURCE":"Goliath Pack"},{"NAME":"Distraction","RESTRICTION":"Anyone","CONDITIONS":"Play when your opponent activates a fighter.","EFFECT":"The opposite player must make a Willpower check for the fighter. If the check is failed, the fighter can only make one action this turn, instead of two.","SOURCE":"Goliath Pack"},{"NAME":"Lucky Lho-Stick Case","RESTRICTION":"Anyone","CONDITIONS":"Play this card when a friendly fighter fails an armour save.","EFFECT":"The fighter can re-roll the armour save, ignoring any negative modifiers (including Armour Piercing).","SOURCE":"Goliath Pack"},{"NAME":"Second Wind","RESTRICTION":"Goliath","CONDITIONS":"Play instead of activating a fighter.","EFFECT":"Remove a flesh wound from any fighter’s card.","SOURCE":"Goliath Pack"},{"NAME":"Steel Constitution","RESTRICTION":"Goliath","CONDITIONS":"Play instead of activating a fighter.","EFFECT":"Choose one of your fighters and tuck this card under their fighter card. Until the end of the round, this fighter cannot be affected by weapons with the Gas or Toxin trait, and their Strength and Toughness are used at the t of the game, any nerve checks made for enemy fighters within 8” of them have a -2 modifier.","SOURCE":"Goliath Pack"},{"NAME":"Healthy Paranoia","RESTRICTION":"Anyone","CONDITIONS":"Play when activating a fighter.","EFFECT":"For the rest of the battle, the fighter has a 360° vision arc.","SOURCE":"Goliath Pack"},{"NAME":"Just Add Nails","RESTRICTION":"Anyone","CONDITIONS":"Play when making an attack with a frag grenade, before rolling to hit.","EFFECT":"The grenade’s Blast (3”) trait becomes Blast (5”).","SOURCE":"Goliath Pack"},{"NAME":"Light ‘em Up!","RESTRICTION":"Anyone","CONDITIONS":"Play after deployment before the first Priority roll.","EFFECT":"D3 friendly fighters are equipped with flares.","SOURCE":"Hive Secundus Pack"},{"NAME":"Legendary Hunter","RESTRICTION":"Anyone","CONDITIONS":"Play after deployment before the first Priority roll.","EFFECT":"A friendly fighter gains Fearsome.","SOURCE":"Hive Secundus Pack"},{"NAME":"Emergency Defense","RESTRICTION":"Anyone","CONDITIONS":"Play after deployment before the first Priority roll.","EFFECT":"Place a Trazior pattern sentry gun within 3” of a friendly model.","SOURCE":"Hive Secundus Pack"},{"NAME":"Advanced Reconnaissance","RESTRICTION":"Anyone","CONDITIONS":"Play after deployment before the first Priority roll.","EFFECT":"D3 friendly fighters may immediately perform a Move (Simple) action.","SOURCE":"Hive Secundus Pack"},{"NAME":"Irradiated Ammunition","RESTRICTION":"Anyone","CONDITIONS":"Play after deployment before the first Priority roll.","EFFECT":"One weapon on a friendly fighter gains the Rad-phage trait.","SOURCE":"Hive Secundus Pack"},{"NAME":"Lost Survivor","RESTRICTION":"Anyone","CONDITIONS":"Play before deployment.","EFFECT":"You get a free Ammo-jack or Rogue Doc that will stay until the end of the post-battle sequence.","SOURCE":"Hive Secundus Pack"},{"NAME":"‘Til the Bitter End","RESTRICTION":"Anyone","CONDITIONS":"Play after deployment before the first Priority roll.","EFFECT":"Three friendly
